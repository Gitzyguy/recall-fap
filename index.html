:root[data-theme="dark"]{

*{box-sizing:border-box}

.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer}
.opt .k{font:600 13px var(--f-mono);color:var(--muted);min-width:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.verdict{font-family:var(--f-display);font-weight:700}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}

.timer{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums}

.dots button.ans{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.dots button.cur{outline:2px solid var(--accent)}
.dots button.r{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.note{font-size:13px;color:var(--muted)}
@media (max-width:480px){.card .front{font-size:20px}.stats .n{font-size:20px}.qstem{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

<script type="application/json" id="data">{"ch": {"00": "Wireless Fundamentals", "01": "Managed FortiAP", "02": "Wireless Security", "03": "Wireless Network Access", "04": "FortiAP Profiles", "05": "Rogue APs", "06": "Advanced Options and Monitoring", "07": "FortiAIOps", "08": "Info Collection and Performance", "09": "Troubleshooting"}, "cards": [{"id": "e5a3f6fcb3", "c": "03", "q": "What does the vendor-specific element in beacon frames advertise?", "a": "The FortiAP name, model, and serial number. Useful for site surveys to identify which AP covers an area.", "s": "SG p.163"}, {"id": "82af8b17d8", "c": "03", "q": "What is beacon protection?", "a": "A WPA3 feature on supported Wi-Fi 7 FortiAPs that protects beacon frame integrity (like PMF), preventing beacons that mimic legitimate SSIDs.", "s": "SG p.163"}, {"id": "3aaa44cd36", "c": "03", "q": "What is an SSID group?", "a": "A way to group SSIDs. You select the SSID group in a FortiAP profile the same way you select an SSID. Created under WiFi & Switch Controller > SSIDs > Create New > SSID Group.", "s": "SG p.164"}, {"id": "45bfe2083d", "c": "03", "q": "Block intra-SSID traffic: tunnel vs bridge?", "a": "Tunnel: all client-to-client traffic on the SSID is blocked. Bridge: blocked only per AP. Clients on other APs can still talk unless private VLAN is enabled on the FortiSwitch.", "s": "SG p.165"}, {"id": "556399305f", "c": "03", "q": "Why use VLANs on an SSID instead of more SSIDs?", "a": "Each SSID adds beacons and management frames that consume airtime. VLANs add broadcast domains without extra SSIDs, improving performance and security.", "s": "SG p.169"}, {"id": "771f70b34d", "c": "03", "q": "VLANs with a tunnel mode SSID: what is required?", "a": "The SSID interface becomes a VLAN trunk. Each VLAN interface needs its own IP, admin access, DHCP (server or relay), and firewall policies. Created under Network > Interfaces.", "s": "SG p.170"}, {"id": "4b4f070815", "c": "03", "q": "VLANs with a local bridge SSID: where is traffic tagged?", "a": "The FortiAP tags client traffic and its Ethernet port acts as an 802.1Q trunk. Local traffic is switched at FortiSwitch; only CAPWAP control goes to the controller.", "s": "SG p.171"}, {"id": "7cddf3f76e", "c": "03", "q": "Dynamic VLAN: which security modes?", "a": "Only WPA2-Enterprise or WPA3-Enterprise with RADIUS server authentication. Supported on tunnel and bridge SSIDs.", "s": "SG p.174"}, {"id": "aab0edc4a3", "c": "03", "q": "Three RADIUS attributes for dynamic VLAN?", "a": "IETF 64 Tunnel-Type = VLAN. IETF 65 Tunnel-Medium-Type = IEEE 802. IETF 81 Tunnel-Private-Group-Id = VLAN ID or a name matching a VLAN interface.", "s": "SG p.174"}, {"id": "c4145ba4ba", "c": "03", "q": "What happens if RADIUS returns no VLAN for a dynamic VLAN SSID?", "a": "The client gets the SSID's default VLAN ID (set vlanid). FortiGate does not create VLANs dynamically; you must build them and their policies.", "s": "SG p.175"}, {"id": "c9cca0a4a2", "c": "03", "q": "CLI to enable dynamic VLAN on an SSID?", "a": "config wireless-controller vap, edit <SSID>, set vlanid <default>, set dynamic-vlan enable.", "s": "SG p.175"}, {"id": "c8d5b4b597", "c": "03", "q": "VLAN assignment by name tag: how many VLANs per name, and how chosen?", "a": "One or several, up to eight VLAN IDs per name. With multiple, round robin picks the ID. The name comes back in Tunnel-Private-Group-Id.", "s": "SG p.176"}, {"id": "58ebb74de9", "c": "03", "q": "Where in FortiAuthenticator are RADIUS attributes for VLAN names set, per the guide?", "a": "Authentication > User Management > User Groups.", "s": "SG p.176"}, {"id": "a9b8683a70", "c": "03", "q": "VLAN pool by FortiAP group: what is it for?", "a": "Assigning a specific VLAN based on the client's AP group, for example the lobby AP always uses the guest VLAN.", "s": "SG p.177"}, {"id": "4c5ddea105", "c": "03", "q": "VLAN pool load balancing works on which SSID mode?", "a": "Tunnel mode only.", "s": "SG p.178"}, {"id": "61dbb0b126", "c": "03", "q": "What if the VLAN pool contains no valid VLAN ID?", "a": "The SSID static VLAN ID is used.", "s": "SG p.177"}, {"id": "42b6b4cf6e", "c": "03", "q": "Round robin vs hash VLAN pooling?", "a": "Round robin: VLAN with the fewest clients. Hash: based on a hash of current SSID client count and number of pool entries. Load balancing is tunnel mode only.", "s": "SG p.178"}, {"id": "f7ae31ffc0", "c": "03", "q": "What zone does FortiOS create for load balancing VLANs?", "a": "<SSID interface name>.zone, for example Fortinet.zone. All pool VLANs join it so they share policies.", "s": "SG p.180"}, {"id": "191488deec", "c": "03", "q": "Do VLANs created for AP groups in the SSID page come with interface settings?", "a": "No. FortiGate creates them without network, admin access, or DHCP. You configure those manually.", "s": "SG p.179"}, {"id": "631037fa0e", "c": "03", "q": "Integrated wireless NAC: what does it share with FortiSwitch, and what can it match?", "a": "The same NAC policies. Matches devices, user groups, FortiClient EMS tags, and vulnerabilities. Works on bridge or tunnel SSIDs.", "s": "SG p.184"}, {"id": "2abc3048c9", "c": "03", "q": "Minimum VLANs for wireless NAC and their requirements?", "a": "Two: an onboarding VLAN (subinterface of the SSID, needs DHCP server and device detection, selected in the NAC profile) and a VLAN to reassign matched devices.", "s": "SG p.190"}, {"id": "623e817111", "c": "03", "q": "How are NAC policies evaluated?", "a": "Top to bottom until a policy matches all patterns. Patterns allow wildcards (* ?) and AND. If a NAC policy changes, matched devices are deleted and reevaluated.", "s": "SG p.186"}, {"id": "d9eb4d2f7c", "c": "03", "q": "NAC reconnect rule?", "a": "A device returns to its previous VLAN if it rejoins the same SSID within 10 minutes and the matched NAC policy hasn't changed.", "s": "SG p.188"}, {"id": "06897712a9", "c": "03", "q": "How often are NAC-assigned devices reevaluated?", "a": "Every 120 seconds. If they no longer match (or the policy or profile changes), they go back to the onboarding VLAN.", "s": "SG p.188"}, {"id": "f49302b02b", "c": "03", "q": "Where and how do you view NAC-matched devices?", "a": "Dashboard > Assets & Identities > Matched Devices. CLI on the controller: wlac_hlp -c sta-nac (matched devices) and wlac_hlp -c nacprof (NAC profiles).", "s": "SG p.189"}, {"id": "f0749faa92", "c": "03", "q": "IOC quarantine automation sequence?", "a": "Client hits a malicious site, FortiGate blocks and logs to FortiAnalyzer, FortiAnalyzer checks IOC services, sends a verdict to FortiGate, an automation stitch quarantines the client.", "s": "SG p.194"}, {"id": "445d6de4f3", "c": "03", "q": "Who receives IOC verdicts, and can stitches be pushed by template?", "a": "The root FortiGate of the Security Fabric. Stitches are configured per device; they can't be applied through a FortiManager template.", "s": "SG p.195"}, {"id": "c731e18d0d", "c": "03", "q": "Which SSID mode supports wireless client quarantine?", "a": "Tunnel mode only, with the APs and FortiGate in the Security Fabric.", "s": "SG p.196"}, {"id": "3d705c268c", "c": "03", "q": "What does enabling quarantine on an SSID create automatically?", "a": "A quarantine soft switch, interface, DHCP server, and captive portal.", "s": "SG p.197"}, {"id": "004daaa89b", "c": "03", "q": "Is there a quarantine firewall policy by default?", "a": "No. You create limited-access policies for remediation yourself.", "s": "SG p.196"}, {"id": "76ad19dd1a", "c": "03", "q": "How do you manually quarantine a wireless client and release it?", "a": "Quarantine from Dashboard > WiFi > Clients By FortiAP, Security Fabric > Physical Topology, or FortiView. Release from Dashboard > Assets & Identities > Quarantine.", "s": "SG p.198"}, {"id": "dc09f238eb", "c": "03", "q": "What policies do quarantined clients need for remediation?", "a": "You create them manually, typically DNS plus specific HTTP/S to remediation resources.", "s": "SG p.197"}, {"id": "b6389c1d1d", "c": "03", "q": "Does local traffic between devices on the same FortiAP VLAN or bridge group reach the controller?", "a": "No. FortiAP handles it locally. It reaches the controller or WAN port only if the destination is on an external network, so networks configured on the AP stay isolated from each other.", "s": "SG p.173"}, {"id": "e726f52ddd", "c": "05", "q": "What is a rogue AP?", "a": "An unauthorized AP connected to your wired network. Neighboring APs in range are not necessarily rogues; they may only cause interference.", "s": "SG p.245"}, {"id": "d9d2dd1a45", "c": "05", "q": "Two problems a rogue AP can cause?", "a": "Signal interference that keeps clients off your Wi-Fi, and unauthorized network access if it's connected to your network.", "s": "SG p.245"}, {"id": "35d965f6f6", "c": "05", "q": "Two ways FortiAP scans for other APs?", "a": "During idle periods of normal AP operation (background), or as a dedicated monitor (one or both radios).", "s": "SG p.246"}, {"id": "0246375f73", "c": "05", "q": "Background scan timing defaults?", "a": "A scan period starts every 600 seconds. Each second a different channel is monitored for 20 ms until all channels are checked.", "s": "SG p.247"}, {"id": "749955c9eb", "c": "05", "q": "Background scanning trade-offs?", "a": "Scans only the radio's band, can cause packet loss under heavy traffic, slower and poorer rogue detection. Enabled automatically with DARRP.", "s": "SG p.247"}, {"id": "188897ae46", "c": "05", "q": "Dedicated monitor characteristics?", "a": "Continuous foreground scans, faster discovery, can suppress rogues with deauth frames, can't serve clients or broadcast SSIDs. Best practice: one dedicated monitor AP in the network.", "s": "SG p.248"}, {"id": "b1d23d0283", "c": "05", "q": "Why use a foreground scan channel list, and where is it set?", "a": "Fewer channels shorten the dwell cycle so the AP reports more often. Set in the WIDS profile: ap-scan-channel-list-2G-5G and ap-scan-channel-list-6G.", "s": "SG p.249"}, {"id": "47e8464d66", "c": "05", "q": "How does on-wire rogue detection work?", "a": "FortiOS compares wireless client MACs with MACs seen on the wire. A client of an unauthorized AP seen on the wire means that AP is on-wire. Needs at least one client sending traffic.", "s": "SG p.250"}, {"id": "c9a1224548", "c": "05", "q": "Two on-wire detection methods?", "a": "Exact MAC address match, and MAC adjacency (similar wired and wireless MACs, used when the rogue is a NAT router).", "s": "SG p.251"}, {"id": "12fe00901c", "c": "05", "q": "MAC adjacency setting, default, and range?", "a": "config wireless-controller global, rogue-scan-mac-adjacency. Default 7, range 0 to 31. False positives are possible.", "s": "SG p.251"}, {"id": "af4e922efa", "c": "05", "q": "How does FortiAP learn wired MACs for on-wire detection?", "a": "It collects wired MAC addresses seen in ARP requests and sends them to the wireless controller.", "s": "SG p.251"}, {"id": "20819a0a65", "c": "05", "q": "What happens when unauthorized AP traffic is also seen on the wire?", "a": "The controller logs an alert, and if suppression is enabled, interferes with the connections.", "s": "SG p.251"}, {"id": "2c45642b79", "c": "05", "q": "What makes on-wire detection harder?", "a": "MAC spoofing and NAT on the rogue AP.", "s": "SG p.251"}, {"id": "bd7133fce9", "c": "05", "q": "Rogue suppression requirements?", "a": "Check local laws first. Needs a dedicated FortiAP radio in monitor mode. Not possible with background scanning. Uses on-wire detection.", "s": "SG p.252"}, {"id": "5190e8db37", "c": "05", "q": "How does suppression work?", "a": "The controller, through the dedicated monitor radio, sends deauth frames to rogue clients pretending to be the rogue AP, and to the rogue AP pretending to be its clients.", "s": "SG p.252"}, {"id": "cd9052f269", "c": "05", "q": "Where is the rogue AP monitor, and does marking an AP Rogue block it?", "a": "Dashboard > WiFi > Rogue APs. Marking Accepted or Rogue is for tracking only. Select Suppressed Rogue AP to block it. The On Wire column shows on-wire detection.", "s": "SG p.253"}, {"id": "6742d9e9ac", "c": "05", "q": "Other ways to discover rogue APs besides the monitor list?", "a": "Audit-grade reports, on-wire correlation, automatic suppression, and WIDS.", "s": "SG p.253"}, {"id": "b4be2aa677", "c": "08", "q": "On the CLI, what are the AP and the radio called?", "a": "The AP is the wtp and the radio is the rId.", "s": "SG p.319"}, {"id": "209e9ff2f3", "c": "08", "q": "Why do radio metrics really describe the location?", "a": "Retry rate and channel utilization reflect the RF around the AP, including the clients using it.", "s": "SG p.320"}, {"id": "86cff1fbcc", "c": "08", "q": "Why is the upstream connection harder to assess from the controller?", "a": "Most metrics are measured from the AP. Clients have lower transmit power and weaker antennas, and only the client NIC can measure the signal it receives.", "s": "SG p.321"}, {"id": "13b4108d08", "c": "08", "q": "Wireless health measures vs wireless capacity measures?", "a": "Health: channel noise, signal strength, link rates, retry rate, loss rate. Capacity: channel utilization, association count, data throughput.", "s": "SG p.322"}, {"id": "0aefaec3ce", "c": "08", "q": "What is the prime indicator of connection quality?", "a": "Link rate, because the chipset calculates it from signal strength, SNR, and retry and loss rates.", "s": "SG p.322"}, {"id": "2fc921df14", "c": "08", "q": "Channel noise: how is it measured, and what causes it?", "a": "An estimate the AP interface takes of the noise floor when not serving clients (not exact, may differ from the client). Causes: microwaves, Bluetooth, wireless cameras and alarms, distant APs.", "s": "SG p.323"}, {"id": "3844dfb392", "c": "08", "q": "Good signal strength but unusually low link rate suggests what?", "a": "A noise problem lowering the SNR.", "s": "SG p.323"}, {"id": "559348ed27", "c": "08", "q": "Signal strength on the controller: whose signal is it?", "a": "The client's signal as received by the AP (RSSI). It doesn't measure the AP's signal at the client, which is usually somewhat stronger.", "s": "SG p.324"}, {"id": "8d51e239ee", "c": "08", "q": "Possible causes of a low-signal client?", "a": "User too far from the AP (move or add an AP), a nearby AP is down so the client joined a farther one, or a sticky client.", "s": "SG p.324"}, {"id": "14004dc660", "c": "08", "q": "Best measure of upstream client connection quality without touching the client?", "a": "The upstream link rate.", "s": "SG p.325"}, {"id": "0fadbdcd64", "c": "08", "q": "Possible causes of low link rates?", "a": "Low signal, small SNR, high retry or loss rate, wrong interface or older standard client, or client power-saving mode.", "s": "SG p.325"}, {"id": "06806b2fed", "c": "08", "q": "What does channel utilization measure, and what drives it up?", "a": "Percentage of used airtime on the channel, counting your traffic and neighbors'. Driven by many stations, low link rate clients, high-throughput apps, and neighbor networks on the channel.", "s": "SG p.327"}, {"id": "eb1c78896b", "c": "08", "q": "Causes of a higher than expected association count?", "a": "A nearby AP or interface down, or an unexpected client mix favoring one band.", "s": "SG p.328"}, {"id": "650800775b", "c": "08", "q": "Client-per-radio guidelines?", "a": "About 30 per radio for large file or streaming clients (for example, education), about 50 for basic file, print, and internet.", "s": "SG p.332"}, {"id": "f4a5739e6d", "c": "08", "q": "Channel utilization threshold for adding capacity?", "a": "Regularly over 75 percent: add AP capacity, or change channel if neighbors cause it.", "s": "SG p.332"}, {"id": "aefb44c827", "c": "08", "q": "Fixes for poorly connected clients?", "a": "Add APs where coverage is needed, spectrum analysis for interference, and band steering (frequency handoff) to move dual-band clients to 5 GHz.", "s": "SG p.333"}, {"id": "cfa4c4b648", "c": "08", "q": "What is coherent interference?", "a": "Co-channel or adjacent channel Wi-Fi that can be decoded, from neighbor APs, poor channel planning, or high TX power. Channel utilization is a good indicator.", "s": "SG p.334"}, {"id": "068f230fca", "c": "08", "q": "What is non-coherent interference, and what does it take to find it?", "a": "Non-Wi-Fi energy (Bluetooth, microwaves, cordless phones) or undecodable distant signals. Specialized equipment is usually needed to locate it.", "s": "SG p.334"}, {"id": "cc62ef4091", "c": "08", "q": "Strength and weakness of AP-based spectrum analysis?", "a": "Can be left in place to log interference continuously, but can't pinpoint the source well.", "s": "SG p.335"}, {"id": "cd6d1ffc1d", "c": "08", "q": "Strength and weakness of a dedicated spectrum analyzer?", "a": "Mobile with a directional antenna and interferer signatures, but must be onsite when the interference happens.", "s": "SG p.335"}, {"id": "82e73187a5", "c": "08", "q": "Healthy interface guide values?", "a": "Noise -92 or weaker ideal (high -80s OK, low -80s bad). Signal -64 or stronger. SNR 15 minimum, 25 or more preferred. Utilization under 75 percent. Client count under 30.", "s": "SG p.336"}, {"id": "2d108a5a7c", "c": "08", "q": "Client link rate near 65 Mbps instead of 433 or 866 Mbps: likely cause?", "a": "The client is on the 2.4 GHz radio instead of 5 GHz (or the underlying metrics are degraded).", "s": "SG p.336"}, {"id": "339d8c2fd5", "c": "08", "q": "Why create an open test network?", "a": "To separate RF problems from authentication. Can't join open: RF or AP overload. Joins open but not secured with correct credentials: client configuration or compatibility.", "s": "SG p.337"}, {"id": "9b35b57915", "c": "08", "q": "Command to debug one client's connection on the controller?", "a": "diagnose wireless-controller wlac sta_filter <client MAC> 2. It shows association, four-way handshake, and DHCP phases.", "s": "SG p.338"}, {"id": "cafafc2843", "c": "08", "q": "What does a PSK mismatch look like in the sta_filter debug?", "a": "invalid MIC in msg 2/4 of 4-Way Handshake, repeated, then WPA_PTK DISCONNECTED and the client is denied.", "s": "SG p.340"}, {"id": "fa33f8a03c", "c": "08", "q": "What is SAM?", "a": "Service Assurance Manager: a dedicated FortiAP radio acts as a client and runs ping and iPerf tests against another FortiAP's SSID, with results in Wi-Fi event logs. No overlay sensors needed.", "s": "SG p.341"}, {"id": "a716e9e1ae", "c": "08", "q": "Key SAM CLI settings in the wtp-profile radio?", "a": "sam-ssid, sam-bssid, sam-security-type, sam-password, sam-captive-portal (for captive portal SSIDs), sam-test iperf, sam-server, iperf-server-port, iperf-protocol, sam-report-intv.", "s": "SG p.342"}, {"id": "c4a4baeb74", "c": "07", "q": "What operational challenges does FortiAIOps address?", "a": "Too much wireless data to monitor, the need for multi-technology experts, slow troubleshooting from vague user reports, and poor use of network resources.", "s": "SG p.303"}, {"id": "ed1fa1f892", "c": "07", "q": "What technologies does FortiAIOps use, and what does it rely on?", "a": "AI and machine learning, relying on logs from the wireless controller. Goals: faster root cause analysis and lower mean time to recover.", "s": "SG p.304"}, {"id": "c2fad4eac6", "c": "07", "q": "What data sources does FortiAIOps gather from?", "a": "Switched and wireless infrastructure, DHCP, and authentication servers, plus event logs from FortiGate controllers.", "s": "SG p.305"}, {"id": "7b5a99e23e", "c": "07", "q": "What makes FortiAIOps predictive?", "a": "Machine learning learns normal network behavior, predicts issues, and recommends fixes before users are affected.", "s": "SG p.306"}, {"id": "3a501bfb97", "c": "07", "q": "FortiAIOps key tools?", "a": "Real-time remediation suggestions, in-depth log analysis for root cause, FortiGate configuration review, a web dashboard, and predictive monitoring.", "s": "SG p.306"}, {"id": "0d1ab03712", "c": "07", "q": "What is FortiAIOps wireless SAM?", "a": "Service Assurance Manager: proactive baseline monitoring with scheduled measurement and threshold tests of connectivity and throughput from FortiAP devices managed by FortiGate.", "s": "SG p.308"}, {"id": "03be2b1c05", "c": "07", "q": "Two FortiAIOps dashboards in the guide?", "a": "Dashboard > Summary (network performance, health, security, real-time bandwidth, CPU, memory, app performance) and Dashboard > Wireless (key wireless metrics).", "s": "SG p.309"}, {"id": "a7ba78dad9", "c": "07", "q": "What do FortiAIOps AI Insights provide?", "a": "Proactive issue detection by cross-checking events and data, a spectrum analyzer for interference, heatmaps, and service assurance that checks SLAs from the AP perspective.", "s": "SG p.310"}, {"id": "7ea54b3331", "c": "07", "q": "How are FortiGates, FortiAPs, and FortiSwitches added to FortiAIOps?", "a": "Add FortiGates under Inventory > Managed FortiGates (ADD one, or IMPORT a CSV). FortiAPs and FortiSwitches controlled by those FortiGates are added automatically, and AP config changes sync automatically.", "s": "SG p.311"}, {"id": "a90dca8140", "c": "07", "q": "What does Inventory > Managed FortiGates show?", "a": "Model, serial number, firmware version, uptime, and CPU, memory, and bandwidth use.", "s": "SG p.311"}, {"id": "f221bfcc2b", "c": "07", "q": "What does Wireless > Access Points show?", "a": "Status, band, model, radio channels, applied profiles, and broadcast SSIDs, with View Details for client, radio, and traffic stats.", "s": "SG p.312"}, {"id": "57892d47f3", "c": "07", "q": "What does Wireless > Clients show?", "a": "MAC, IP, OS, VLAN ID, and channel. View Details adds signal quality, data use, connection duration, and roaming history.", "s": "SG p.312"}, {"id": "069ac89486", "c": "07", "q": "What does Wireless > Channel Summary show?", "a": "Bands in use, activity per channel, interference, clients, active radios, data speed, noise, and a health score per channel.", "s": "SG p.313"}, {"id": "a8c88b5b61", "c": "07", "q": "What does Wireless > Rogue APs show in FortiAIOps?", "a": "SSID, manufacturer, MAC, signal interference strength, network status, which FortiAP first detected it, channel, and whether it's on the wire.", "s": "SG p.313"}, {"id": "34eae1d36d", "c": "07", "q": "What does FortiAIOps single-pane management offer?", "a": "Unified LAN and WAN edge monitoring and troubleshooting with AI-powered insights, a GUI aligned to the Fortinet experience, and historical data and trends with drilldown.", "s": "SG p.307"}, {"id": "9ba2b88414", "c": "04", "q": "What does a FortiAP profile define, and what is it called in the CLI?", "a": "Radio settings, operating band, channels, and SSIDs to broadcast, specific to an AP model (platform). In the CLI it is the WTP profile: config wireless-controller wtp-profile.", "s": "SG p.205"}, {"id": "72d7b3a8c1", "c": "04", "q": "How is the default FortiAP profile named and assigned?", "a": "Model name plus -default (for example FAP231F-default), assigned automatically on discovery. No config is pushed until the AP is authorized.", "s": "SG p.206"}, {"id": "cb5ce26574", "c": "04", "q": "How many FortiAP profiles can one AP have?", "a": "One. A profile can be assigned to many APs, but an AP can't have multiple profiles.", "s": "SG p.209"}, {"id": "a6e804ac83", "c": "04", "q": "Actions available on an authorized AP in Managed FortiAPs?", "a": "Change status (authorize or deauthorize), upgrade firmware, change profile, restart, and Telnet to the FortiAP CLI. GUI upgrade needs registration and a support contract.", "s": "SG p.207"}, {"id": "62cf479db6", "c": "04", "q": "How do you preauthorize a FortiAP?", "a": "Add it by serial number (one at a time) under config wireless-controller wtp, optionally with a wtp-profile. When it comes online, FortiGate authorizes it automatically.", "s": "SG p.208"}, {"id": "cdbb141c3c", "c": "04", "q": "Profile vs per-AP configuration?", "a": "The profile applies to all APs using it. Per-AP overrides go on the CLI under config wireless-controller wtp, edit <serial>.", "s": "SG p.209"}, {"id": "ec13941802", "c": "04", "q": "What is Dedicated scan, and when is it unavailable?", "a": "The third radio on Wi-Fi 6/6E platforms collects RF analysis and threat data. Not available when Dual 5G mode is used.", "s": "SG p.210"}, {"id": "97aaa9f8bf", "c": "04", "q": "Managed FortiAP direct admin access: default and how to change?", "a": "Dropped by default after FortiGate manages the AP. Enable HTTPS or SSH in the FortiAP profile (all APs inherit) or per AP. Login password: Set or Leave Unchanged.", "s": "SG p.211"}, {"id": "6d4ba22bfd", "c": "04", "q": "Which EAP methods can FortiAP use as an 802.1X supplicant?", "a": "EAP-FAST, EAP-TLS, or EAP-PEAP, for APs on switch ports with 802.1X.", "s": "SG p.211"}, {"id": "206d2f9d47", "c": "04", "q": "LAN port bridge with LAN port vs with SSID?", "a": "With LAN: AP acts as a hub, LAN clients get IPs from the WAN side, same range as the AP. With SSID: AP acts as a switch joining wired and wireless on the same subnet, IPs from the SSID's DHCP.", "s": "SG p.212"}, {"id": "0b8197f458", "c": "04", "q": "Three radio modes in a FortiAP profile?", "a": "Disabled, Access Point (normal), Dedicated Monitor (monitoring only, no clients).", "s": "SG p.213"}, {"id": "7b5d96a290", "c": "04", "q": "2.4 GHz channel plan options in the profile?", "a": "Three Channels (1, 6, 11) or Four Channels (1, 4, 8, 11).", "s": "SG p.213"}, {"id": "c386758a93", "c": "04", "q": "SSID broadcast options per radio?", "a": "Tunnel (all tunnel SSIDs), Bridge (all bridge SSIDs), or Manual (pick a mix).", "s": "SG p.213"}, {"id": "1562529383", "c": "04", "q": "Short guard interval default?", "a": "Disabled. Enabling gives marginally better throughput on 802.11ac or 802.11n on 5 GHz.", "s": "SG p.213"}, {"id": "56d57d9553", "c": "04", "q": "How do you get a 320 MHz channel in a FortiAP profile?", "a": "Use a K-series platform, select the 802.11be band on the 6 GHz radio. AKM24 is Wi-Fi 7 only and requires WPA3-SAE on the SSID.", "s": "SG p.214"}, {"id": "ccb3597bbd", "c": "04", "q": "What does DARRP do?", "a": "Distributed automatic radio resource provisioning: each AP picks the clearest channel from background scan data (BSSID/RSSI) to reduce interference. Can briefly disconnect clients on changes.", "s": "SG p.217"}, {"id": "29eab53707", "c": "04", "q": "Default DARRP optimization interval and range?", "a": "86400 seconds (24 hours). Range 0 to 86400. Set with darrp-optimize, overridable per DARRP (arrp) profile with override-darrp-optimize.", "s": "SG p.217"}, {"id": "199952633c", "c": "04", "q": "Can DARRP catch intermittent interference like microwaves?", "a": "No. It doesn't do continuous spectrum analysis.", "s": "SG p.217"}, {"id": "dfe43b890c", "c": "04", "q": "Two DARRP phases?", "a": "Phase 1: calculates parameters (noise floor, channel load) times weights. Phase 2: monitors for retry and receive error thresholds.", "s": "SG p.218"}, {"id": "8d62781161", "c": "04", "q": "CLI to assign a custom DARRP profile to radio 1?", "a": "config wireless-controller wtp-profile, edit <profile>, config radio-1, set darrp enable, set arrp-profile <name>.", "s": "SG p.219"}, {"id": "1a62bc6140", "c": "04", "q": "Three transmit power modes?", "a": "Percent (slider, 100% = regional max), dBm (1 to 33 dBm), Auto (default range 10 to 17 dBm, drops to auto-power-low on interference, rises to auto-power-high).", "s": "SG p.220"}, {"id": "cd394d9191", "c": "04", "q": "FortiAP group rules?", "a": "Created on the Group tab of Managed FortiAPs. An AP can be in only one group, and all members must be the same model.", "s": "SG p.221"}, {"id": "c87e0e670e", "c": "04", "q": "AP handoff vs frequency handoff?", "a": "AP handoff: steer clients to another AP. Frequency handoff: steer clients to a less used band (5 or 6 GHz). Not applied to roaming clients by default.", "s": "SG p.225"}, {"id": "8c1030d546", "c": "04", "q": "How does AP handoff signal a client to go elsewhere?", "a": "802.11 association response with status code 17 (AP busy).", "s": "SG p.227"}, {"id": "cdbe4e0a87", "c": "04", "q": "handoff-sta-thresh vs max-client?", "a": "handoff-sta-thresh (5 to 35): client count where handoff begins (best practice 15 to 20, up to 10 for video). max-client: hard reject limit, 0 means no limit.", "s": "SG p.228"}, {"id": "4af7ad9a4a", "c": "04", "q": "What does handoff-rssi 25 mean?", "a": "Range 20 to 30, default 25, relative to a -95 dBm noise level. 25 means -70 dBm or better at the other AP; 30 means -65 dBm.", "s": "SG p.228"}, {"id": "9203b9b78b", "c": "04", "q": "Is ap-handoff enabled by default, and where is it configured?", "a": "Disabled by default. Enable in the FortiAP profile; thresholds only on the CLI. Must be enabled on all radios of the AP.", "s": "SG p.228"}, {"id": "740293148b", "c": "04", "q": "Frequency handoff: how does FortiGate steer a dual-band client?", "a": "It tracks client band capability and RSSI, ignores 2.4 GHz join requests from capable clients with good 5 or 6 GHz RSSI until they time out, then answers on 5 or 6 GHz. Enable it on the 5 or 6 GHz radio.", "s": "SG p.231"}, {"id": "494abc9962", "c": "04", "q": "Best practice handoff-rssi values?", "a": "Voice 25 to 30. Regular data and video 23 to 27.", "s": "SG p.231"}, {"id": "2bf1394aee", "c": "04", "q": "Which WIDS detection flags frames with both FromDS and ToDS set?", "a": "Wireless bridge. It also flags bridges you configured on purpose.", "s": "SG p.238"}, {"id": "04bf398138", "c": "04", "q": "Which WIDS detection logs MACs whose first 3 bytes aren't a valid IEEE OUI?", "a": "Invalid MAC OUI.", "s": "SG p.238"}, {"id": "c2a265501e", "c": "04", "q": "Which WIDS detection targets LEAP authentication attacks?", "a": "ASLEAP attack detection.", "s": "SG p.238"}, {"id": "6d186f5593", "c": "04", "q": "Which WIDS detection catches a response that makes many clients stop responding?", "a": "Null SSID probe response.", "s": "SG p.238"}, {"id": "39a4edc946", "c": "04", "q": "Default thresholds for association and authentication frame flooding?", "a": "30 requests in 10 seconds.", "s": "SG p.238"}, {"id": "9cd4b4da1c", "c": "04", "q": "Long duration attack threshold range and default?", "a": "1000 to 32,767 microseconds. Default 8200.", "s": "SG p.238"}, {"id": "aa7716df05", "c": "04", "q": "Background rogue AP scanning default interval in a WIDS profile?", "a": "The radio switches to monitor mode every 600 seconds to scan.", "s": "SG p.236"}, {"id": "1ee75f647d", "c": "04", "q": "Four settings for automatic on-wire rogue AP suppression?", "a": "Dedicated monitor radio, sensor mode, rogue AP detection, and auto-suppress rogue APs in foreground scan.", "s": "SG p.237"}, {"id": "527066812b", "c": "04", "q": "Which suppression setting is needed only for automatic, not manual, suppression?", "a": "Auto-suppress rogue APs in foreground scan. Manual suppression needs the other three.", "s": "SG p.237"}, {"id": "bb63e67082", "c": "04", "q": "How many WIDS profiles per radio?", "a": "One per radio, but the same WIDS profile can be reused on other radios and other FortiAP profiles. Foreground scanning needs dedicated monitor mode.", "s": "SG p.239"}, {"id": "f2b0dc2353", "c": "04", "q": "AP handoff works in which two ways?", "a": "1. Over the AP's max clients: the client with the lowest RSSI is forced to another AP, if its RSSI meets the threshold there. 2. At the threshold: new clients are redirected to the least busy nearby AP.", "s": "SG p.226"}, {"id": "b2d6c41cf4", "c": "04", "q": "Channel planning rule for 2.4 GHz, and why is 5 GHz different?", "a": "Use every fourth or fifth channel (1, 6, 11) because channel width exceeds channel spacing. 5 GHz has shorter range and less penetration, so less interference from other APs. DARRP evaluates the full channel bandwidth when it selects.", "s": "SG p.216"}, {"id": "ec75e434c5", "c": "00", "q": "What is a carrier signal?", "a": "A radio sine wave with a constant, predictable pattern. It carries no information until it is modulated.", "s": "SG p.7"}, {"id": "6e1f036910", "c": "00", "q": "What does the frequency of an RF signal measure?", "a": "How many times the wave cycles from a lower to a higher energy state per second, in Hz. 2.4 GHz is 2.4 billion cycles per second.", "s": "SG p.8"}, {"id": "bd174883b0", "c": "00", "q": "Why can an AP send 2.4 GHz and 5 GHz signals at the same time through the same antenna?", "a": "Signals on different frequencies do not interfere with each other. Signals on the same or adjacent frequencies can.", "s": "SG p.9"}, {"id": "d41768f154", "c": "00", "q": "What is the amplitude of an RF signal?", "a": "The energy, power, or loudness of the signal. Walls, water, and bodies attenuate it heavily; air attenuates very little.", "s": "SG p.10"}, {"id": "7d88c24bf2", "c": "00", "q": "In practice, why do higher-frequency signals have a shorter range?", "a": "Antenna aperture makes higher-frequency signals harder to receive. In theory, only amplitude affects distance.", "s": "SG p.10"}, {"id": "60f066e4db", "c": "00", "q": "State the inverse square law as it applies to Wi-Fi.", "a": "Signal power changes in inverse proportion to the square of the distance from the source. 2x distance is 1/4 power, 3x is 1/9, 25x is about 1/625. It never reaches zero.", "s": "SG p.13"}, {"id": "c0cff7dbdb", "c": "00", "q": "What is dBm, and why is it used instead of watts?", "a": "Decibels referenced to 1 mW. It is logarithmic, matching how signals weaken. Watts are linear and awkward for tiny received values.", "s": "SG p.14"}, {"id": "37e545b9d1", "c": "00", "q": "What is the 3 dB rule?", "a": "A 3 dB increase roughly doubles power. A 3 dB decrease roughly halves it.", "s": "SG p.14"}, {"id": "73d3fd2060", "c": "00", "q": "Per the guide, what is the typical maximum transmit power of an AP radio?", "a": "About 200 mW (0.2 W).", "s": "SG p.14"}, {"id": "4a4c27dc60", "c": "00", "q": "Is antenna gain active or passive, and what unit measures it?", "a": "Passive. The antenna shapes and directs the signal without an amplifier. Measured in dBi, relative to an ideal isotropic antenna.", "s": "SG p.16"}, {"id": "38bba91976", "c": "00", "q": "Directional vs omnidirectional antenna?", "a": "Directional: focused beam that reaches further with less coverage (point-to-point links, hallways). Omnidirectional: doughnut pattern in all directions on one plane (Wi-Fi routers, mobile adapters).", "s": "SG p.17"}, {"id": "964e33da2a", "c": "00", "q": "Which channel widths are available, and in which bands?", "a": "20 and 40 MHz in all bands. 80 and 160 MHz in 5 and 6 GHz only. 320 MHz in 6 GHz only.", "s": "SG p.19"}, {"id": "e1873538dd", "c": "00", "q": "What is channel bonding, which standard introduced it, and where is it practical?", "a": "Combining two adjacent 20 MHz channels into one 40 MHz channel. Introduced with 802.11n (high throughput). Practical in 5 GHz, impractical in 2.4 GHz.", "s": "SG p.20"}, {"id": "fb3f58c0db", "c": "00", "q": "What is the trade-off of wider channels?", "a": "More data per channel, but fewer channels fit in the spectrum. That limits how many APs you can deploy and raises CCI risk. The guide says 160 MHz is not practical beyond a single-AP home.", "s": "SG p.19"}, {"id": "b2423231dd", "c": "00", "q": "Define noise and SNR.", "a": "Noise is an unintended signal on the same frequency. SNR is the difference in dB between the intended signal and the noise floor.", "s": "SG p.22"}, {"id": "c0c7aefc14", "c": "00", "q": "What is duty cycle, and why does it matter for noise?", "a": "The percentage of time a signal is present (airtime used). A high-duty-cycle, low-strength noise signal can be as disruptive as a powerful short-duty-cycle one.", "s": "SG p.22"}, {"id": "2f46e764ce", "c": "00", "q": "Why can a client suffer from noise the AP does not report?", "a": "Noise is localized. The APs take the noise measurements, so a noise source near the client may not show up at the AP.", "s": "SG p.22"}, {"id": "481d6bedbf", "c": "00", "q": "Constructive vs destructive interference?", "a": "In phase: the signal is enhanced (which is why noise adds up). 180 degrees out of phase: the signals cancel. Complete cancellation is unlikely in the real world.", "s": "SG p.23"}, {"id": "99f1f03abe", "c": "00", "q": "Why does Wi-Fi behave like a network hub?", "a": "It is a shared, half-duplex medium. All devices on the same channel share the same airtime, and only one transmits at a time.", "s": "SG p.27"}, {"id": "319f0f70e5", "c": "00", "q": "Why does Wi-Fi use CSMA/CA instead of CSMA/CD?", "a": "Wireless stations cannot transmit and receive at the same time, so they cannot detect collisions. They try to avoid them instead.", "s": "SG p.28"}, {"id": "2a91fbfb80", "c": "00", "q": "What happens if a unicast frame's sender gets no ACK?", "a": "It assumes a collision or error at the receiver and retransmits after a short wait. ACKs carry no user data but consume airtime.", "s": "SG p.28"}, {"id": "f28f85d53b", "c": "00", "q": "Order the modulation methods from lowest to highest data rate.", "a": "DSSS/FHSS (low, 1 to 11 Mbps), then BPSK/QPSK (medium, 802.11a/g), then QAM (highest). 4096-QAM (4K QAM) arrives with Wi-Fi 7. More complex modulation needs better signal quality.", "s": "SG p.29"}, {"id": "b41a7e4af5", "c": "00", "q": "BPSK vs QPSK: bits per phase change?", "a": "BPSK: a 180 degree phase change represents 1 bit. QPSK: a 90 degree phase change represents 2 bits.", "s": "SG p.29"}, {"id": "2a07d2f685", "c": "00", "q": "What does MIMO notation NxM:S mean?", "a": "N = transmit RF chains, M = receive RF chains, S = spatial streams. Streams define data capacity, and chains do not always equal streams (for example, 3 chains with 2 streams).", "s": "SG p.30"}, {"id": "8552714e86", "c": "00", "q": "What is maximal ratio combining (MRC)?", "a": "A receive diversity technique that combines multiple received signals to improve overall signal quality.", "s": "SG p.30"}, {"id": "ea5dba51a3", "c": "00", "q": "What is spatial multiplexing?", "a": "Using multipath reflections to send different data streams over different signal paths at the same time.", "s": "SG p.31"}, {"id": "4a963bf5ea", "c": "00", "q": "Implicit vs explicit beamforming?", "a": "Implicit: the transmitter passively estimates the client's location. Explicit: the other radio gives feedback. 802.11ac/ax mandate explicit beamforming.", "s": "SG p.31"}, {"id": "000d79da87", "c": "00", "q": "Downlink vs uplink MU-MIMO: which standards?", "a": "802.11ac wave 2 introduced downlink MU-MIMO (up to four clients). 802.11ax adds uplink MU-MIMO and proposes eight. It can degrade performance, so disabling it is sometimes beneficial.", "s": "SG p.32"}, {"id": "9925efbc01", "c": "00", "q": "What is OFDMA, and what does it improve?", "a": "Introduced in 802.11ax. The channel is split into subchannels so multiple devices transmit in parallel, with the AP controlling allocation. It helps most with many small packets.", "s": "SG p.33"}, {"id": "1bd6c62a4f", "c": "00", "q": "What mainly determines a link (MCS) rate?", "a": "Signal strength, SNR, and channel width. Each direction has its own rate, and radios shift down if signal drops or noise rises.", "s": "SG p.36"}, {"id": "75f237acc1", "c": "00", "q": "How does real throughput compare with the quoted PHY rate?", "a": "Typically 50 percent or less of the PHY rate, because of CSMA/CA overhead, management frames, and half-duplex operation.", "s": "SG p.37"}, {"id": "216774cf33", "c": "00", "q": "Which OSI layers does 802.11 define, and how is layer 2 split?", "a": "Physical and data link. The data link layer is split into MAC and LLC sublayers.", "s": "SG p.41"}, {"id": "01e0d5b831", "c": "00", "q": "2.4 GHz band facts per the guide?", "a": "14 channels defined, only 3 usable (1, 6, 11). Channels overlap, so adjacent channels cause adjacent channel interference (ACI). Up to 600 Mbps PHY.", "s": "SG p.44"}, {"id": "bab9d0f917", "c": "00", "q": "5 GHz band facts per the guide?", "a": "37 possible 20 MHz channels defined. Channels do not overlap. Up to 19 usable depending on width and location.", "s": "SG p.45"}, {"id": "68642c1da5", "c": "00", "q": "What is DFS, and which standard requires it?", "a": "Dynamic frequency selection, required by IEEE 802.11h. 5 GHz radios must avoid radar (airport, weather, military, shipping).", "s": "SG p.46"}, {"id": "f87bfe66af", "c": "00", "q": "6 GHz band facts per the guide?", "a": "5.925 to 7.125 GHz (1200 MHz in the US, 500 MHz in Europe). Requires Wi-Fi 6E certification. Only 802.11ax/be, no older standards. Mid-bands UNII-5 to UNII-8.", "s": "SG p.47"}, {"id": "d1109299b5", "c": "00", "q": "Map the Wi-Fi generations to 802.11 standards.", "a": "Wi-Fi 4 = 802.11n, Wi-Fi 5 = 802.11ac, Wi-Fi 6 = 802.11ax, Wi-Fi 7 = 802.11be. Wi-Fi 6E means 6 GHz capable.", "s": "SG p.48"}, {"id": "f2e80a8e5f", "c": "00", "q": "IEEE vs Wi-Fi Alliance roles?", "a": "IEEE writes the 802.11 specs but does not test. The Wi-Fi Alliance is a non-profit that certifies interoperability and defines WPA, WPA2, WPA3, and WMM.", "s": "SG p.41"}, {"id": "f242ff4b2f", "c": "00", "q": "What does 802.11mc enable on FortiAP?", "a": "Location tracking using fine timing measurement (FTM) and round-trip time (RTT). FortiAP acts as an FTM responder. Enabled in a FortiAP profile.", "s": "SG p.50"}, {"id": "c50dad6224", "c": "00", "q": "What is clear channel assessment (CCA)?", "a": "The radio listens to and decodes frames on its channel to see if it is busy, and reads the duration field to know how long it will be in use.", "s": "SG p.54"}, {"id": "1d7ae58e0a", "c": "00", "q": "What is CCI, and how do you minimize it?", "a": "Co-channel interference: nearby APs on the same channel. Use different channels on adjacent APs, and reduce transmit power in high density. Planning factors: channel widths, AP density, DFS, transmit power.", "s": "SG p.57"}, {"id": "5352cbd2bb", "c": "00", "q": "SSID vs BSSID vs ESSID?", "a": "BSSID: the radio's MAC address. SSID: the human-readable network name. ESSID: a group of APs offering the same SSID.", "s": "SG p.58"}, {"id": "050564ee48", "c": "00", "q": "What does an AP beacon contain, and how often is it sent?", "a": "SSID, BSSID, and supported link rates, about every 100 ms. It is a broadcast management frame: no ACK, no client data.", "s": "SG p.59"}, {"id": "864a98d4eb", "c": "00", "q": "What is a sticky client, and what is the impact?", "a": "A client that won't roam. Its link rates drop, it uses more airtime (hurting other clients), and it expands the CCI area. Airtime fairness helps.", "s": "SG p.61"}, {"id": "f8cb0743b0", "c": "00", "q": "Does a radio dedicated to spectrum analysis or WIPS need a channel?", "a": "No. Its function is to scan multiple channels.", "s": "SG p.63"}, {"id": "2578fc16e0", "c": "00", "q": "What three improvements give 802.11ac its throughput?", "a": "More spatial streams (more antennas), more spectrum (wider channels), and denser modulation (more bits per symbol).", "s": "SG p.49"}, {"id": "a844d43761", "c": "00", "q": "When does MU-MIMO work?", "a": "Only if both the clients and the AP support it. It arrived with 802.11ac wave 2 APs.", "s": "SG p.49"}, {"id": "fd7005245e", "c": "00", "q": "Why must neighboring APs overlap, and what goes wrong if they share a channel?", "a": "Overlap keeps the signal consistent as clients move. If neighboring APs transmit on the same channel without coordination, you get co-channel interference, so each island gets its own channel.", "s": "SG p.55"}, {"id": "d97e1b333c", "c": "00", "q": "Who decides when a client roams?", "a": "The client. It monitors signal strength, looks for another BSSID offering the same SSID, and decides when to disconnect and join the new AP.", "s": "SG p.60"}, {"id": "1a1b7d133d", "c": "00", "q": "What sources of noise does the guide list?", "a": "Another AP or client with a signal too weak to decode, another radio device that will never be decoded, and random energy such as a microwave.", "s": "SG p.21"}, {"id": "8d91e7d829", "c": "01", "q": "Does the FortiGate integrated wireless controller need an extra license?", "a": "No. FortiGate does not require any additional licenses to enable the built-in wireless controller.", "s": "SG p.70"}, {"id": "45a93d18bc", "c": "01", "q": "Name the three core Fortinet secure WLAN use cases.", "a": "Campus (multi-floor building or campus), Branch or SD-Branch (many small sites, often no onsite IT), Teleworker (remote AP at a home or microbranch).", "s": "SG p.71"}, {"id": "d7057cbcab", "c": "01", "q": "FortiAP vs FortiAP-U vs FortiWiFi?", "a": "FortiAP: thin APs (Wi-Fi 5 to Wi-Fi 7). FortiAP-U: adds FortiGuard UTP services and dual 5 GHz on Wi-Fi 6. FortiWiFi: thick AP, combines AP, LAN switch, and entry-level FortiGate.", "s": "SG p.72"}, {"id": "8fe587db1a", "c": "01", "q": "Which FortiAP model suffix maps to which Wi-Fi standard?", "a": "C and E: Wi-Fi 5 (wave 1 and wave 2). F: Wi-Fi 6. G: Wi-Fi 6E. K: Wi-Fi 7. Example: 443K is Wi-Fi 7, 231G is Wi-Fi 6E, 234F is Wi-Fi 6.", "s": "SG p.75"}, {"id": "2743cec4bc", "c": "01", "q": "Which models support Fortinet external antennas, and which support third-party antennas?", "a": "Fortinet external antennas: 432F, 433F, 243K, 443K. Third-party antennas: F, G, and U models (enable external antenna in the FortiAP profile, pick a model, set gain manually).", "s": "SG p.73"}, {"id": "66d35f163b", "c": "01", "q": "Name the three key Wi-Fi 7 features listed in the guide.", "a": "Multilink operation (MLO), multiple resource units (MRU), and puncturing. Wi-Fi 7 uses 4096-QAM and runs on 2.4, 5, and 6 GHz on FortiAP K models.", "s": "SG p.74"}, {"id": "bc4d101027", "c": "01", "q": "Four Fortinet wireless management options?", "a": "FortiGate (integrated controller, no license), FortiEdge Cloud (standalone FortiAP), FortiManager (AP Manager for FortiGate-controlled APs), FortiSASE (FortiAP as an edge device for microbranch).", "s": "SG p.76"}, {"id": "b6bf8734b2", "c": "01", "q": "FortiExtender in LAN extension mode with a FortiAP: how does wireless traffic get back to FortiGate?", "a": "FortiExtender automatically builds a secure IPsec/VXLAN connection back to the FortiGate AC.", "s": "SG p.79"}, {"id": "fd9ab055e3", "c": "01", "q": "CLI to enable the wireless controller on FortiGate?", "a": "config system global, set wireless-controller enable, end. It is enabled by default on most models.", "s": "SG p.84"}, {"id": "3cecf67638", "c": "01", "q": "Where do you set the Wi-Fi country, and what is the default?", "a": "WiFi & Switch Controller > WiFi Settings, WiFi country/region. The default is United States.", "s": "SG p.84"}, {"id": "dd6f075e21", "c": "01", "q": "List the six FortiAP discovery methods in order.", "a": "Static, DHCP (option 138), DNS (AC_HOSTNAME_1), FortiEdge Cloud (apctrl1.fortilcloud.com), multicast (224.0.1.140), broadcast.", "s": "SG p.85"}, {"id": "ca29b85682", "c": "01", "q": "What is the default discovery interval, and its range?", "a": "5 seconds by default, random range 2 to 180. Set with config wireless-controller timers. Up to three requests per method before moving on.", "s": "SG p.85"}, {"id": "048bd951ea", "c": "01", "q": "What FortiAP state follows a failed final broadcast discovery?", "a": "SULKING. After about 30 seconds it enters AC_IP_DISCVER, then IDLE, then DISCOVERY.", "s": "SG p.85"}, {"id": "fbd8884d79", "c": "01", "q": "Convert 192.168.0.1 for DHCP option 138.", "a": "C0A80001. Convert each octet to hex, left to right, and concatenate.", "s": "SG p.85"}, {"id": "87bfebe143", "c": "01", "q": "Which discovery methods suit an AP on a different subnet from the controller?", "a": "Static IP or DNS hostname (configured on the AP before deployment), or DHCP option 138. Multicast also works if multicast routing is configured.", "s": "SG p.85"}, {"id": "414928e55f", "c": "01", "q": "CAPWAP ports and encryption?", "a": "UDP 5246 for control, UDP 5247 for data. The data channel can be encrypted with DTLS.", "s": "SG p.86"}, {"id": "f0ff7f4aca", "c": "01", "q": "What must you enable on the FortiGate interface that connects FortiAPs?", "a": "Security Fabric Connection administrative access (for CAPWAP), plus a DHCP server for the APs.", "s": "SG p.86"}, {"id": "de38d50bb5", "c": "01", "q": "Four steps of CAPWAP discovery and join?", "a": "1. Discovery request and response. 2. Secure DTLS session. 3. After authorization, CAPWAP discovery and join. 4. FortiGate pushes management and WLAN config.", "s": "SG p.86"}, {"id": "f9a7b86c9b", "c": "01", "q": "How do you authorize a discovered AP, and what profile does it get?", "a": "WiFi & Switch Controller > Managed FortiAPs, right-click the AP, Authorization > Authorize. It gets the default AP profile for its model.", "s": "SG p.88"}, {"id": "f6914010f0", "c": "01", "q": "CLI to auto-authorize newly discovered FortiAPs?", "a": "config system interface, edit <AP interface>, set auto-auth-extension-device enable, end.", "s": "SG p.88"}, {"id": "f07d180c6a", "c": "01", "q": "Two automatic FortiAP firmware upgrade options?", "a": "FortiAP auto firmware provisioning (WiFi Settings page, upgrades once at authorization) and automatic patch upgrades (System > Firmware & Registration, scheduled, same train).", "s": "SG p.90"}, {"id": "dd30f8c2c3", "c": "01", "q": "Manual CLI firmware upgrade for all APs?", "a": "Upload: execute wireless-controller upload-wtp-image <tftp/ftp> <file> <server IP>. Push to all: execute wireless-controller reset-wtp all. The GUI upgrades one AP at a time.", "s": "SG p.91"}, {"id": "447cfce785", "c": "01", "q": "What must be enabled before a hitless rolling FortiAP upgrade will work?", "a": "The global setting: config wireless-controller global, set rolling-wtp-upgrade enable (with a threshold such as -70).", "s": "SG p.92"}, {"id": "96f64006d7", "c": "01", "q": "After the global setting, where else is rolling-wtp-upgrade enabled?", "a": "config wireless-controller setting, set rolling-wtp-upgrade enable.", "s": "SG p.92"}, {"id": "9f9b76ce8b", "c": "01", "q": "Default FortiAP GUI access and credentials when unmanaged?", "a": "DHCP client, HTTPS enabled. User admin, blank password (case sensitive). After it is managed, admin access is controlled by the FortiAP profile.", "s": "SG p.93"}, {"id": "bcc6accc9c", "c": "01", "q": "What can FortiExplorer do on FortiAP G and K models over BLE?", "a": "Initial configuration, plus debug and monitor while managed. No serial console or SSH needed.", "s": "SG p.94"}, {"id": "23c8cc1f16", "c": "01", "q": "Four managed AP topologies?", "a": "Direct connection (wire closet), switched connection (gateway), connection over WAN (datacenter remote management), wireless mesh (distributed).", "s": "SG p.98"}, {"id": "8bc42ed3b6", "c": "01", "q": "How many controller IPs can you configure on a FortiAP for WAN deployments?", "a": "Three, for redundant failover. Static controller IP is best for remote APs.", "s": "SG p.98"}, {"id": "0e96ff1f4e", "c": "01", "q": "Mesh best practice on a two-radio FortiAP?", "a": "One radio (best practice 5 GHz) for the backhaul SSID, one for client SSIDs. Background Wi-Fi scanning is not available in that mode.", "s": "SG p.102"}, {"id": "02907ce220", "c": "01", "q": "Mesh roles: root, branch, leaf?", "a": "Root: the only AP cabled to the network. Branch: relays when the leaf is out of range of the root. Leaf: serves normal clients.", "s": "SG p.102"}, {"id": "1fbf717e2c", "c": "01", "q": "Mesh with wireless bridge: special rule?", "a": "The mesh root for a point-to-point bridge must be a FortiAP, not a FortiWiFi. Configure bridging on the branch FortiAP. Only one radio can carry the mesh SSID.", "s": "SG p.103"}, {"id": "21d7884ee4", "c": "01", "q": "FortiEdge Cloud free basic license limits?", "a": "15 FortiAPs and one FortiSwitch per account, up to three sites, 7-day log retention.", "s": "SG p.107"}, {"id": "7bb2b8c819", "c": "01", "q": "FortiEdge Cloud AP management ports?", "a": "Discovery over HTTPS TCP 443. Configuration, event logs, and statistics over CAPWAP UDP 5246 and 5247. Client traffic is bridged locally, not tunneled to the cloud.", "s": "SG p.110"}, {"id": "90379baa81", "c": "01", "q": "How do you provision a FortiAP with a FortiCloud key in FortiEdge Cloud?", "a": "Register it in FortiCare > Asset Management, then Devices > Inventory Devices > Asset Sync, then right-click > Actions > Deploy.", "s": "SG p.111"}, {"id": "809043a2ba", "c": "01", "q": "What does FortiZTP do for FortiEdge Cloud?", "a": "Loads devices registered to asset management (UNPROVISIONED tab) and provisions them. Provisioned APs appear in FortiEdge Cloud as deployed.", "s": "SG p.112"}, {"id": "7ed7fa9d10", "c": "01", "q": "Which FortiAP models get lightweight UTP from FortiEdge Cloud?", "a": "FortiAP K-series 44xK and 24xK.", "s": "SG p.107"}, {"id": "5baa746fb4", "c": "01", "q": "Key benefits of FortiAP managed by FortiGate?", "a": "Zero-touch deployment (FortiGate can authorize APs automatically), no extra licenses, single-pane management (FortiGate or FortiManager, no need to log in to the AP), Security Fabric integration (SSIDs used in policies like interfaces), and automation at the access layer.", "s": "SG p.83"}, {"id": "df38bf4bbb", "c": "01", "q": "Direct connection topology: key traits?", "a": "FortiAP connects straight to FortiGate with no layer 3 device between, no AP preconfiguration, broadcast discovery, AP gets its IP from FortiGate. Also called a wire closet deployment, ideal for home or small office.", "s": "SG p.99"}, {"id": "53b644e2c7", "c": "01", "q": "FortiEdge Cloud features in the free basic version?", "a": "Manage and deploy wireless networks, built-in guest management, self-registration, protection profiles, scheduled upgrades, local or remote RADIUS, AP location maps, real-time network view.", "s": "SG p.109"}, {"id": "4c3ab35b5a", "c": "01", "q": "What does a FortiEdge Cloud premium account add?", "a": "Multi-tenancy: manage multiple customers from one GUI, create independent subaccounts, and assign AP networks to a subaccount.", "s": "SG p.109"}, {"id": "25f0e413ee", "c": "09", "q": "Wireless sniffing basics on FortiAP?", "a": "A radio captures one frequency at a time (use two FortiAPs for both bands). Use a dedicated sniffer AP that supports the same standards, placed near the target AP or client.", "s": "SG p.349"}, {"id": "fc4270f337", "c": "09", "q": "Where is the FortiAP capture file stored, and how do you get it off?", "a": "/tmp/wl_sniff.cap. Upload with ftftp -l /tmp/wl_sniff.cap -r sniff.cap -p <TFTP IP> before rebooting or changing radio settings.", "s": "SG p.349"}, {"id": "c8e92a9074", "c": "09", "q": "How do you put a radio in sniffer mode?", "a": "CLI only: config wireless-controller wtp-profile, edit <profile>, config radio-1, set mode sniffer, then ap-sniffer-chan, ap-sniffer-addr, bufsize, and mgmt-beacon, mgmt-other, ctl, data options.", "s": "SG p.350"}, {"id": "4c5a93340b", "c": "09", "q": "What does ap-sniffer-addr 00:00:00:00:00:00 do?", "a": "Wildcard: captures all traffic on the channel, which can be more than you need.", "s": "SG p.350"}, {"id": "bdcc2e47f3", "c": "09", "q": "How do you confirm a radio is in sniffer mode on the FortiAP?", "a": "iwconfig. The interface shows Mode:Monitor and the captured frequency, and doesn't broadcast SSIDs.", "s": "SG p.351"}, {"id": "4ea785fc2a", "c": "09", "q": "Controller command to list all connected stations?", "a": "diag wireless-controller wlac -d sta (filter with grep -v 0.0.0.0). Shows SSID, IP, MAC, signal, noise, channel, security.", "s": "SG p.352"}, {"id": "a6024ee4a2", "c": "09", "q": "Which controller command lists neighboring APs?", "a": "get wireless-controller scan.", "s": "SG p.352"}, {"id": "944c2b684c", "c": "09", "q": "Which controller command shows RF conditions and RF score for all radios?", "a": "get wireless-controller rf-analysis (optionally per WTP ID). The GUI shows only the worst interfaces.", "s": "SG p.352"}, {"id": "8d962275b1", "c": "09", "q": "Which controller command shows client load over hours and days?", "a": "get wireless-controller status.", "s": "SG p.352"}, {"id": "a45a163d36", "c": "09", "q": "Ways to reach the FortiAP CLI?", "a": "Controller GUI (Connect to CLI), FortiExplorer (G and later), console cable, direct SSH (if enabled), Telnet or SSH from the controller, CAPWAP tunnel.", "s": "SG p.353"}, {"id": "d7bc0d40e7", "c": "09", "q": "CAPWAP tunnel CLI access limits?", "a": "Useful when the AP is behind NAT. Results return only after the command finishes, a new command cancels the previous one, output max 4M, default 32K.", "s": "SG p.353"}, {"id": "0dfafd75c0", "c": "09", "q": "Default FortiAP CLI timeout and how to extend it?", "a": "5 minutes. cfg -a ADMIN_TIMEOUT=<mins>, then cfg -c.", "s": "SG p.354"}, {"id": "7367646889", "c": "09", "q": "What does cw_diag -d sta <MAC> show?", "a": "Station layer 1 metrics: lost frames, retry frames, and SNR. Rising lost frames suggest the client can't decode AP frames (poor signal at the client or high noise).", "s": "SG p.355"}, {"id": "0958144700", "c": "09", "q": "cw_diag channel use commands?", "a": "cw_diag -c his-chutil: last minute of use on the configured channel. cw_diag -c all-chutil: use on all allowed channels.", "s": "SG p.356"}, {"id": "0f4473b163", "c": "09", "q": "What does cw_diag ksta (alias sta) give you that nothing else does?", "a": "Downstream and upstream link rates per client, plus RSSI. Data must be flowing for accurate rates since idle devices lower rates to save power.", "s": "SG p.354"}, {"id": "c5fbdf9b31", "c": "09", "q": "FortiAP wlanXY interface naming?", "a": "X: 0 = 2.4 GHz, 1 = 5 GHz, 2 = 6 GHz. Y increments per SSID. Per-interface stats: cw_diag stats wlanXY.", "s": "SG p.357"}, {"id": "a00e1d39d3", "c": "09", "q": "Basic troubleshooting checklist?", "a": "Is the station connected? Does it have an IP? Can it reach key resources? Has the client changed? Is channel configuration OK? Too many SSIDs?", "s": "SG p.361"}, {"id": "9dfee6c6a0", "c": "09", "q": "How do you find the Wi-Fi MAC on Windows and macOS?", "a": "Windows: netsh wlan show interfaces. macOS: networksetup -listallhardwareports (airport -I for detail).", "s": "SG p.362"}, {"id": "b72af33dc9", "c": "09", "q": "MAC privacy on mobile devices?", "a": "Android uses a randomized MAC and iOS a private address by default. Disable per SSID in the network details. The address may differ from the hardware MAC in settings.", "s": "SG p.363"}, {"id": "2daaa61285", "c": "09", "q": "Connected client with no valid IP (or 169.254): causes?", "a": "DHCP scope exhaustion, DHCP infrastructure issues, wrong dynamic VLAN from RADIUS, or a misconfigured static IP. For bridged networks, a non-FortiGate DHCP server may be needed.", "s": "SG p.364"}, {"id": "b83ee4be2d", "c": "09", "q": "Client has a valid IP but can't ping key hosts: causes?", "a": "A firewall policy or routing issue blocking traffic, or a captive portal that hasn't been triggered.", "s": "SG p.365"}, {"id": "d58240c915", "c": "09", "q": "Recommended maximum SSIDs, and airtime cost of 10 SSIDs on one AP?", "a": "Five or fewer. One AP with 10 SSIDs uses about 32 percent of airtime on management frames, and neighbor APs add overhead too.", "s": "SG p.366"}, {"id": "f39060d79a", "c": "02", "q": "Three SSID traffic modes on FortiGate?", "a": "Tunnel, bridge, and mesh.", "s": "SG p.119"}, {"id": "0b11ef9862", "c": "02", "q": "When must the SSID traffic mode be chosen?", "a": "At initial SSID creation. You can't change it afterward.", "s": "SG p.119"}, {"id": "0a3961e60b", "c": "02", "q": "Which SSID mode is the default?", "a": "Tunnel mode.", "s": "SG p.120"}, {"id": "55054bfddb", "c": "02", "q": "Tunnel mode pros and cons?", "a": "Pros: central security enforcement, L3 segmentation, FortiGuard inspection. Cons: FortiGate must be sized for the traffic, and Wi-Fi goes down if the controller goes down.", "s": "SG p.120"}, {"id": "4908c9b679", "c": "02", "q": "How is a tunnel mode SSID treated on FortiGate?", "a": "As a layer 3 interface with its own subnet, DHCP, DNS, admin access, and a separate firewall policy.", "s": "SG p.121"}, {"id": "aefeb68e97", "c": "02", "q": "Bridge mode pros and cons?", "a": "Pros: wired and wireless share a broadcast domain, 1 Gbps or more per AP locally, some models inspect traffic. Con: limited VLAN pooling options. Only CAPWAP control goes to the controller.", "s": "SG p.122"}, {"id": "01a0c75251", "c": "02", "q": "Bridge mode security profiles: which ones and what is required?", "a": "Antivirus (with botnet), IPS, web filter, application control, on supported FortiAP models only, with a separate FortiGuard subscription per AP. Bridge mode only.", "s": "SG p.123"}, {"id": "8f38b31a12", "c": "02", "q": "Minimum devices for wireless mesh?", "a": "Three: FortiGate as controller, FortiAP as mesh root, FortiAP as leaf.", "s": "SG p.125"}, {"id": "84bbc296ef", "c": "02", "q": "Where is a mesh backhaul SSID broadcast?", "a": "Manually, through the FortiAP profile of the root AP.", "s": "SG p.126"}, {"id": "b3b33948b1", "c": "02", "q": "How does a leaf FortiAP join a mesh?", "a": "On the leaf (HTTPS or SSH), set uplink to Mesh and enter the mesh SSID and key, then authorize it in Managed FortiAPs.", "s": "SG p.126"}, {"id": "e7a51f61b7", "c": "02", "q": "FortiAP CLI to make a leaf use mesh uplink?", "a": "cfg -a MESH_AP_TYPE=1, cfg -a MESH_AP_SSID=<mesh SSID>, cfg -a MESH_AP_PASSWD=<key>, cfg -c, exit.", "s": "SG p.126"}, {"id": "42b84c901c", "c": "02", "q": "Three parties in 802.1X?", "a": "Supplicant (device joining), authenticator (AP or switch, FortiOS here), authentication server (RADIUS and EAP host, such as FortiAuthenticator).", "s": "SG p.131"}, {"id": "b8aed8839e", "c": "02", "q": "Does the 802.1X authenticator need a certificate or know the EAP method?", "a": "No. Authentication is tunneled from the client to the RADIUS server over RADIUS.", "s": "SG p.131"}, {"id": "b80072aabf", "c": "02", "q": "PEAPv0 vs PEAPv1?", "a": "PEAPv0/MSCHAPv2: client authenticated with MSCHAPv2. PEAPv1/EAP-GTC: flexible, supports OTP, supported by FortiAuthenticator but not common elsewhere. Both start with a TLS session using a server certificate.", "s": "SG p.133"}, {"id": "94302f3805", "c": "02", "q": "Why is EAP-TLS preferred over PEAP?", "a": "Both client and server need valid certificates, so it doesn't depend on password strength. It requires a PKI for all wireless clients.", "s": "SG p.134"}, {"id": "d69723acea", "c": "02", "q": "EAP-TTLS key points?", "a": "TLS session first with a server certificate, then AVPs authenticate the client with a native EAP method or legacy PAP/CHAP. Client certificate optional. Often needs a third-party utility.", "s": "SG p.135"}, {"id": "21c7ddf0d6", "c": "02", "q": "WPA2 order of events with 802.1X?", "a": "802.1X authentication, then association, then the four-way handshake.", "s": "SG p.137"}, {"id": "28c59fa185", "c": "02", "q": "Master keys vs temporal keys in WPA2?", "a": "Master: PMK (from 802.1X/EAP or PSK) and GMK. Temporal: PTK (unicast, no timeout) and GTK (broadcast and multicast, changes regularly). Five keys total.", "s": "SG p.137"}, {"id": "b6e27c1693", "c": "02", "q": "When does a new four-way handshake happen?", "a": "Every time dynamic keys are created, including every time a client roams to another AP.", "s": "SG p.138"}, {"id": "baaaec2b08", "c": "02", "q": "What does RSN require for encryption?", "a": "AES-based CCMP.", "s": "SG p.137"}, {"id": "403ae8cb67", "c": "02", "q": "WPA3 SAE: what is it based on and what does it fix?", "a": "Dragonfly Key Exchange (RFC 7664). It addresses KRACK and resists offline dictionary attacks. The passphrase is no longer used directly to derive the PMK.", "s": "SG p.139"}, {"id": "ae569174f6", "c": "02", "q": "WPA2 vs WPA3 encryption and session key size?", "a": "WPA2: AES-CCMP, 128-bit. WPA3: AES-GCM with elliptic curve cryptography (CNSA Suite B), 192-bit. PMF is mandatory in WPA3.", "s": "SG p.140"}, {"id": "96547a3a5a", "c": "02", "q": "Order of the WPA3 SAE exchange?", "a": "Probe request and response, SAE commit (client), SAE commit (AP), SAE confirm (client), SAE confirm (AP), association request and response, four-way handshake.", "s": "SG p.141"}, {"id": "bda8243ad8", "c": "02", "q": "Security modes the FortiGate wireless controller supports?", "a": "WPA/WPA2 (Personal, Enterprise, Personal + captive portal), WPA3, captive portal, open, OWE, OSEN.", "s": "SG p.145"}, {"id": "cd76705371", "c": "02", "q": "How many MPSK profiles can an SSID have?", "a": "One MPSK profile per SSID, which can hold multiple MPSK groups.", "s": "SG p.147"}, {"id": "c266cc3e33", "c": "02", "q": "What happens to the single PSK when MPSK is enabled?", "a": "It's dropped and no longer works.", "s": "SG p.147"}, {"id": "eb31483321", "c": "02", "q": "What can you do with MPSK groups and keys?", "a": "Map a VLAN per group, batch generate, import, export to CSV, and apply schedules.", "s": "SG p.147"}, {"id": "34eaea08f5", "c": "02", "q": "What is SAE-PK, and what is H2E?", "a": "SAE-PK: SAE public key, needs a private key generated with third-party tools. H2E (Hash-to-Element only): a hash function for a secure key exchange.", "s": "SG p.148"}, {"id": "b77bd627c1", "c": "02", "q": "What does WPA3 SAE transition mode do?", "a": "Lets WPA3 clients use SAE while clients that can't do WPA3 connect with WPA2-Personal.", "s": "SG p.149"}, {"id": "e4f14f65f7", "c": "02", "q": "WPA3-Enterprise Only vs WPA3-Enterprise?", "a": "Both are RADIUS based and enable PMF automatically. WPA3-Enterprise Only: 128-bit. WPA3-Enterprise: 192-bit, CLI: set security wpa3-enterprise, set pmf enable.", "s": "SG p.150"}, {"id": "8df1f29be2", "c": "02", "q": "In 802.1X local authentication, what roles does FortiGate play?", "a": "Both authenticator and authentication server.", "s": "SG p.151"}, {"id": "e941b1d03b", "c": "02", "q": "Which EAP method does FortiGate local 802.1X support?", "a": "PEAP only, using local users in user groups.", "s": "SG p.151"}, {"id": "8f69344233", "c": "02", "q": "Which certificate does FortiGate local 802.1X present by default, and where is it changed?", "a": "The factory default certificate, changeable in WiFi & Switch Controller > WiFi Settings.", "s": "SG p.151"}, {"id": "081c7972f1", "c": "02", "q": "Remote RADIUS on FortiGate: where do you define the server?", "a": "User & Authentication > RADIUS Servers, then select it on the SSID. FortiGate is the authenticator only.", "s": "SG p.152"}, {"id": "7a251d674c", "c": "02", "q": "WSSO requirements?", "a": "Local user groups on FortiGate with names matching what RADIUS returns in VSA Fortinet-Group-Name (vendor ID 12356). Case sensitive.", "s": "SG p.153"}, {"id": "58232d1b09", "c": "02", "q": "Three captive portal types and supported traffic modes?", "a": "Authentication (tunnel and bridge), Disclaimer + Authentication (tunnel), Disclaimer Only (tunnel). Email Collection also exists but isn't covered.", "s": "SG p.155"}, {"id": "6657f8b485", "c": "02", "q": "Local vs external authentication portal?", "a": "Local: FortiGate hosts the login page and processes authentication. External: FortiGate redirects to an external server's FQDN or IP, which presents the page and validates.", "s": "SG p.156"}, {"id": "27b866f83c", "c": "02", "q": "Captive portal certificate warnings on bridge SSIDs?", "a": "Upload the certificate to the FortiAP to avoid browser security warnings.", "s": "SG p.156"}, {"id": "52fc70c2c0", "c": "02", "q": "Is EAP a wire protocol? Name the EAP types the guide lists.", "a": "No. EAP only defines message formats, and each protocol encapsulates them. Types: Cisco LEAP (proprietary), EAP-TLS, PEAP, EAP-TTLS, EAP-SIM.", "s": "SG p.132"}, {"id": "0673b4a8af", "c": "02", "q": "Can a FortiWiFi in client mode use enterprise authentication?", "a": "Yes. Supported FortiWiFi models in client mode can join a WPA2/WPA3-Enterprise SSID using PEAP or EAP-TLS.", "s": "SG p.136"}, {"id": "0f7ce303c6", "c": "02", "q": "Main weakness of WPA2-Personal?", "a": "Everyone shares one static passphrase. If a user leaves or a device is lost, the key must be changed and every AP and client reconfigured. Key length and complexity matter a lot.", "s": "SG p.146"}, {"id": "5eb8c13060", "c": "06", "q": "How do you make advanced wireless features visible?", "a": "System > Feature Visibility, enable Advanced Wireless Features. Some core features such as WIDS then move to a different GUI section.", "s": "SG p.259"}, {"id": "85b2cdb890", "c": "06", "q": "Where are QoS, L3 firewall, and FortiAP configuration profiles assigned?", "a": "QoS and L3 firewall profiles: in the SSID interface settings. FortiAP configuration profiles: in the managed FortiAP settings.", "s": "SG p.259"}, {"id": "16e3b8ce0d", "c": "06", "q": "What is an L3 firewall profile?", "a": "A Wi-Fi bridge access control list (IPv4 and IPv6) under WiFi & Switch Controller > Protection Profiles > L3 Firewall Profiles. Rules match IP, ports, IANA protocol. Assigned on the SSID.", "s": "SG p.260"}, {"id": "6e0ff4c9fd", "c": "06", "q": "Which WMM categories can a QoS profile map to DSCP?", "a": "AC_VO, AC_VI, AC_BE, and AC_BK.", "s": "SG p.261"}, {"id": "816fb90e58", "c": "06", "q": "Where is a QoS profile created and assigned?", "a": "WiFi & Switch Controller > Operation Profiles > QoS Profiles, assigned in the SSID advanced settings.", "s": "SG p.261"}, {"id": "5e5abef845", "c": "06", "q": "What is a FortiAP configuration profile?", "a": "A command list for local FortiAP settings (for example AC_DISCOVERY_TYPE, AC_IPADDR_1) per FortiAP family platform. CLI: config wireless-controller apcfg-profile. Needs the AP password if one is set.", "s": "SG p.262"}, {"id": "da6c6e0586", "c": "06", "q": "Four guest access methods on FortiGate?", "a": "Guest SSID, internal captive portal, guest management (temporary accounts), and external captive portal.", "s": "SG p.258"}, {"id": "defeb10f91", "c": "06", "q": "Guest SSID best practices?", "a": "Use tunnel mode for full control and inspection, broadcast only on APs where guests are expected, and avoid too many SSIDs.", "s": "SG p.264"}, {"id": "f562c59435", "c": "06", "q": "Where are emails from an Email Collection captive portal shown?", "a": "Dashboard > Assets & Identities > Collected Email. Enable Email Collection in Feature Visibility.", "s": "SG p.266"}, {"id": "23e5c83dc3", "c": "06", "q": "Captive portal traffic exemption: two-step method?", "a": "1. Add exempt destinations and services on the SSID or interface. 2. Create a matching firewall policy on the captive portal interface (no destination needed).", "s": "SG p.268"}, {"id": "98313c739c", "c": "06", "q": "Captive portal exemption: firewall policy method?", "a": "Create a policy to the portal server (plus DNS or AD) and enable Exempt from Captive Portal (CLI, or GUI with Policy Advanced Options visible).", "s": "SG p.269"}, {"id": "9f6efec620", "c": "06", "q": "Captive portal address with HTTPS?", "a": "Must be an FQDN that matches the certificate CN used on FortiGate.", "s": "SG p.269"}, {"id": "59737ca827", "c": "06", "q": "Guest internet policy rule?", "a": "Source User Group = guest group, and do not enable Exempt from Captive Portal, or everyone gets internet without logging in.", "s": "SG p.270"}, {"id": "b1bf79a43c", "c": "06", "q": "External captive portal: who POSTs the credentials to FortiGate?", "a": "The client browser, instructed by the FortiAuthenticator login page.", "s": "SG p.271"}, {"id": "bc5630a48e", "c": "06", "q": "External captive portal: who sends the RADIUS Access-Request?", "a": "FortiGate, to FortiAuthenticator, after it receives the HTTPS POST.", "s": "SG p.271"}, {"id": "b6d7f0b4ca", "c": "06", "q": "External captive portal: what happens after the Access-Accept?", "a": "FortiGate sends Accounting-Request, FortiAuthenticator replies, then redirects the client to the original URL.", "s": "SG p.271"}, {"id": "aead2609bb", "c": "06", "q": "Default HTTPS authentication port and how to change it?", "a": "1003. config system global, set auth-https-port <port>.", "s": "SG p.272"}, {"id": "4b54d651ae", "c": "06", "q": "Captive portal certificate vs Wi-Fi certificate?", "a": "The authentication certificate (User & Authentication > Authentication Settings) secures the portal page. The Wi-Fi certificate identifies the controller as the 802.1X authentication server.", "s": "SG p.273"}, {"id": "38b040fd92", "c": "06", "q": "What does the magic parameter in the external portal redirect mean?", "a": "The session ID used to track the request.", "s": "SG p.274"}, {"id": "6266f3a4cb", "c": "06", "q": "Parameters FortiGate sends to an external captive portal?", "a": "apname, apip, ssid, bssid, apmac, usermac, device_type, userip, magic, login, post (FortiGate fgtauth URL on port 1003).", "s": "SG p.275"}, {"id": "3f3dd12de1", "c": "06", "q": "How do you use an FQDN for the FortiGate auth address in the redirect?", "a": "config firewall auth-portal. The FQDN must resolve to the FortiGate interface where the captive portal is enabled.", "s": "SG p.274"}, {"id": "4a267dc735", "c": "06", "q": "BLE scanning: what and where configured?", "a": "FortiAP scans BLE beacons for location services and sends data to FortiGate. CLI: config wireless-controller ble-profile with set ble-scanning enable, assigned in a FortiAP profile.", "s": "SG p.276"}, {"id": "1c6b566eef", "c": "06", "q": "Which FortiWiFi models do concurrent AP and client mode?", "a": "80F/81F-2R. They join a third-party SSID as a client and broadcast their own SSID.", "s": "SG p.277"}, {"id": "7dd92ae194", "c": "06", "q": "What does a Bonjour profile solve, and where is it?", "a": "mDNS doesn't cross VLANs. Bonjour profiles bridge Apple service discovery across VLANs. WiFi & Switch Controller > Connectivity Profiles, assigned in the FortiAP profile (set bonjour-profile).", "s": "SG p.278"}, {"id": "fae248ce30", "c": "06", "q": "roaming-acct-interim-update: why and requirements?", "a": "Sends Interim-Update with the same Acct-Session-Id so ISE sees roams as one session. Only with WPA2 or WPA3 Enterprise.", "s": "SG p.279"}, {"id": "9d87726e81", "c": "06", "q": "Three views of the Managed FortiAPs table?", "a": "AP (default), Radio (sort by utilization and load), Group. Right-click headers to add Channel Utilization.", "s": "SG p.283"}, {"id": "1a1d2dbcbe", "c": "06", "q": "What does View More Details on a managed AP show?", "a": "Color-coded health (wireless health, capacity), Clients tab, Logs, CLI Access, and Spectrum Analysis if the AP supports it and is configured.", "s": "SG p.284"}, {"id": "4330d8d662", "c": "06", "q": "Wi-Fi client Diagnostics and Tools?", "a": "Right-click a client: bandwidth and SNR graph (about 10 minutes), connection log (association, auth, DHCP events), quarantine or disassociate, export.", "s": "SG p.285"}, {"id": "c0392b3bc3", "c": "06", "q": "Wi-Fi dashboard widgets?", "a": "FortiAP Status, Channel Utilization, Clients By FortiAP, Signal Strength, Rogue APs, Historical Clients, Interfering SSIDs, Login Failures.", "s": "SG p.286"}, {"id": "33f1dbe7b1", "c": "06", "q": "What do Wi-Fi maps do?", "a": "Upload a floor plan, place FortiAPs, see real-time status, channels, and alerts, and open diagnostics. WiFi & Switch Controller > WiFi Maps.", "s": "SG p.287"}, {"id": "90ca1a6a8c", "c": "06", "q": "FortiAP REST API: two specifications and two auth methods?", "a": "CMDB API (config) and Monitor API (actions like reboot, backup). Session-based or token-based authentication.", "s": "SG p.291"}, {"id": "21d7f6a1a3", "c": "06", "q": "FortiAP API GET calls?", "a": "cfg-get, cfg-meta-get, radio-cfg, sys-perf, sys-status, vap-cfg, wtp-cfg under /api/v1/.", "s": "SG p.292"}, {"id": "550a9a6a2b", "c": "06", "q": "FortiAP API POST calls?", "a": "cfg-set (add or change variables) and reboot.", "s": "SG p.292"}, {"id": "b8300f7efa", "c": "06", "q": "How does FortiAP send logs to syslog?", "a": "A syslog profile (server, log level; port on CLI with set server-port) assigned to a FortiAP profile. Can be shared by multiple profiles.", "s": "SG p.296"}, {"id": "08653ab7dd", "c": "06", "q": "Wi-Fi event logs location and useful columns?", "a": "Log & Report > Events > WiFi Events. For a station: add Band, Data Rate, Physical AP, filter Station MAC. For an AP: add Physical AP and filter on it.", "s": "SG p.297"}], "quiz": [{"id": "q00-1", "c": "00", "q": "A client moves from 2 units to 4 units away from an AP, with nothing else changing. By the inverse square law, what happens to the received power?", "o": ["It drops to about one quarter of the previous value.", "It drops to about one half of the previous value.", "It stays the same because only frequency affects range.", "It drops to about one eighth of the previous value."], "k": [0], "w": "Doubling the distance gives 1/(2^2) = 1/4 power.", "p": "p.10-11"}, {"id": "q00-2", "c": "00", "q": "Why do 802.11 networks use CSMA/CA instead of CSMA/CD?", "o": ["Collision detection would add too many management frames.", "Wireless stations cannot transmit and receive at the same time.", "The IEEE reserves collision detection for 6 GHz radios only.", "Access points detect collisions on behalf of their clients."], "k": [1], "w": "Radios can't transmit and receive at the same time, so they can't detect collisions. They avoid them instead.", "p": "p.20"}, {"id": "q00-3", "c": "00", "q": "An AP's spec sheet lists its radio as 3x3:2. What does this mean?", "o": ["Three spatial streams with two receive antennas.", "Three radios, three bands, and two SSIDs per radio.", "Three transmit chains, three receive chains, two streams.", "Three antennas on 2.4 GHz and two antennas on 5 GHz."], "k": [2], "w": "NxM:S means TX chains x RX chains :
