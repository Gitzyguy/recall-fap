 spatial streams. Chains don't always equal streams.", "p": "p.22"}, {"id": "q00-4", "c": "00", "q": "An administrator wants the highest throughput per AP in a dense office with many APs. Why might 160 MHz channels be a poor choice?", "o": ["160 MHz channels are supported only in the 2.4 GHz band.", "Wider channels raise the noise floor on every client radio.", "160 MHz channels require 802.11mc on all clients to work.", "Too few 160 MHz channels exist to avoid co-channel interference."], "k": [3], "w": "Wider channels mean fewer channels fit. The guide says 160 MHz isn't practical beyond a single-AP home.", "p": "p.16"}, {"id": "q00-5", "c": "00", "q": "Which statement about antenna gain is correct?", "o": ["It is passive, shaping the signal, and measured in dBi.", "It is active, adding power through a built-in amplifier.", "It is measured in dBm and set by the controller profile.", "It is fixed by the radio chipset, not the antenna design."], "k": [0], "w": "Antennas are passive and shape the signal. Gain is measured in dBi, relative to an isotropic antenna.", "p": "p.13"}, {"id": "q00-6", "c": "00", "q": "Which 5 GHz requirement exists because some frequencies are shared with airport and weather radar?", "o": ["Wi-Fi 6E certification under the UNII-5 rules", "Fine timing measurement under IEEE 802.11mc", "Dynamic frequency selection under IEEE 802.11h", "Channel bonding under the 802.11n HT amendment"], "k": [2], "w": "IEEE 802.11h DFS requires 5 GHz radios to avoid radar.", "p": "p.33"}, {"id": "q00-7", "c": "00", "q": "A low-power noise source runs almost continuously near a group of clients. The AP reports a normal noise floor. Which two statements explain why users still complain? (Choose two.)", "o": ["The AP measures noise, and noise can be highly localized near clients.", "Noise can only be measured on radios dedicated to spectrum analysis.", "A high-duty-cycle, low-strength signal can be very disruptive.", "Noise only affects 2.4 GHz, so the 5 GHz floor reads normal."], "k": [0, 2], "w": "APs take the noise measurements and noise is localized. High-duty-cycle, low-strength noise can be as disruptive as strong short bursts.", "p": "p.18"}, {"id": "q00-8", "c": "00", "q": "What does a client mainly use to pick a link (MCS) rate?", "o": ["Its SSID, BSSID, and the beacon interval of the AP", "Its distance in meters as reported by the AP profile", "Its count of other associated clients on the same AP", "Its signal strength, SNR, and channel width in use"], "k": [3], "w": "Link rate depends mainly on signal strength, SNR, and channel width.", "p": "p.27"}, {"id": "q00-9", "c": "00", "q": "Which Wi-Fi generation introduced OFDMA, and what does OFDMA allow?", "o": ["Wi-Fi 5, letting one client use several channels at once", "Wi-Fi 6, letting several devices send at once on subchannels", "Wi-Fi 4, letting two 20 MHz channels bond into a 40 MHz one", "Wi-Fi 7, letting a radio switch bands on every frame it sends"], "k": [1], "w": "OFDMA arrived with 802.11ax (Wi-Fi 6). It splits the channel so multiple devices transmit in parallel.", "p": "p.25"}, {"id": "q00-10", "c": "00", "q": "Which statement about the 6 GHz band is correct, per the guide?", "o": ["It is open to all 802.11 standards from 802.11a onward.", "It offers three usable channels, the same as 2.4 GHz.", "It requires Wi-Fi 6E and only supports 802.11ax/be.", "It uses 1200 MHz in Europe and 500 MHz in the US."], "k": [2], "w": "6 GHz needs Wi-Fi 6E and is 802.11ax/be only. It's 1200 MHz in the US and 500 MHz in Europe.", "p": "p.30, 34"}, {"id": "q00-11", "c": "00", "q": "A sticky client stays associated with a distant AP. Which effect does this have on the network?", "o": ["It uses more airtime and widens the co-channel interference area.", "It forces the AP to raise transmit power on all of its radios.", "It lowers the link rate only for that client, nobody else.", "It causes the AP to stop sending beacons to other clients."], "k": [0], "w": "Sticky clients drop to low rates, use more airtime, and extend the CCI area.", "p": "p.45-46"}, {"id": "q00-12", "c": "00", "q": "What is an ESSID?", "o": ["The MAC address assigned to a single AP radio.", "A broadcast management frame sent every 100 ms.", "The channel list that the AP advertises to clients.", "A group of APs offering the same SSID name."], "k": [3], "w": "The BSSID is the radio MAC. The ESSID is the group of APs sharing one SSID.", "p": "p.42"}, {"c": "01", "q": "A FortiAP sits on a different subnet from the FortiGate, with no multicast routing. Which discovery method needs no change on the AP itself?", "o": ["Broadcast discovery to the local subnet", "Multicast discovery to 224.0.1.140", "DHCP option 138 carrying the controller IP", "Static controller IP set on the AP"], "k": [2], "w": "DHCP option 138 is the default. Static and DNS require configuring the AP first, and broadcast does not cross subnets.", "p": "p.85", "id": "q01-1"}, {"c": "01", "q": "What value goes in DHCP option 138 for a controller at 10.1.1.10?", "o": ["0A01010A", "10010110", "0A0A0101", "A01010A0"], "k": [0], "w": "Convert each octet to hex and concatenate: 0A 01 01 0A.", "p": "p.85", "id": "q01-2"}, {"c": "01", "q": "Which two items must be in place on the FortiGate interface where FortiAPs connect? (Choose two.)", "o": ["Security Fabric Connection access", "FMG-Access administrative access", "A DHCP server for the APs", "A static route to 224.0.1.140"], "k": [0, 2], "w": "CAPWAP needs Security Fabric Connection access, and DHCP gives the APs addresses.", "p": "p.86", "id": "q01-3"}, {"c": "01", "q": "Which ports does CAPWAP use?", "o": ["TCP 5246 control and TCP 5247 data", "UDP 5246 control and UDP 5247 data", "UDP 5247 control and UDP 5246 data", "TCP 443 control and UDP 5247 data"], "k": [1], "w": "Control is UDP 5246 and data is UDP 5247.", "p": "p.86", "id": "q01-4"}, {"c": "01", "q": "An AP has cycled through every discovery method and the last broadcast failed. Which state does it enter?", "o": ["IDLE", "AC_IP_DISCVER", "DISCOVERY", "SULKING"], "k": [3], "w": "A failed final broadcast leads to SULKING. AC_IP_DISCVER comes about 30 seconds later.", "p": "p.85", "id": "q01-5"}, {"c": "01", "q": "You need to upgrade all managed FortiAPs at once from the CLI after uploading the image. Which command?", "o": ["execute wireless-controller reset-wtp all", "execute wireless-controller upgrade-wtp all", "execute wireless-controller restart-wtp all", "execute wireless-controller push-wtp-image all"], "k": [0], "w": "reset-wtp all pushes the firmware to all FortiAPs. The GUI upgrades one at a time.", "p": "p.91", "id": "q01-6"}, {"c": "01", "q": "Which statement about hitless rolling FortiAP upgrades is correct?", "o": ["It must be enabled per AP in the FortiAP profile first.", "It upgrades every AP at once to shorten the outage.", "It must be enabled globally before it can be used.", "It needs FortiEdge Cloud to schedule the upgrade."], "k": [2], "w": "Enable rolling-wtp-upgrade under wireless-controller global first. It staggers the upgrade.", "p": "p.92", "id": "q01-7"}, {"c": "01", "q": "A two-radio FortiAP is a mesh leaf. Following best practice, how should the radios be used?", "o": ["Both radios carry the backhaul SSID for redundancy", "2.4 GHz backhaul SSID, 5 GHz client SSIDs", "Both radios carry client SSIDs and backhaul shares", "5 GHz backhaul SSID, 2.4 GHz client SSIDs"], "k": [3], "w": "Dedicate one radio, best practice 5 GHz, to the backhaul and use the other for clients.", "p": "p.102", "id": "q01-8"}, {"c": "01", "q": "What does the FortiEdge Cloud free basic license include?", "o": ["15 FortiAPs, one FortiSwitch, three sites, 7-day logs", "50 FortiAPs, five FortiSwitches, one site, 30-day logs", "15 FortiAPs, no FortiSwitches, one site, 1-day logs", "Unlimited FortiAPs, one FortiSwitch, 7-day logs"], "k": [0], "w": "Free basic: 15 FortiAPs, one FortiSwitch, up to three sites, 7-day log retention.", "p": "p.107", "id": "q01-9"}, {"c": "01", "q": "A cloud-managed FortiAP cannot reach FortiEdge Cloud. Which port does the AP first use for discovery?", "o": ["UDP 5246", "TCP 443", "UDP 5247", "TCP 8013"], "k": [1], "w": "FortiAP initiates HTTPS on TCP 443 for discovery, then CAPWAP on UDP 5246 and 5247.", "p": "p.110", "id": "q01-10"}, {"c": "01", "q": "A remote worker gets a preconfigured FortiAP to use at home. Which topology and discovery setting fit best?", "o": ["Direct connection with broadcast discovery", "Wireless mesh with a 5 GHz backhaul SSID", "Connection over WAN with a static controller IP", "Switched connection with multicast discovery"], "k": [2], "w": "Over WAN, the guide says it's best to configure a static controller IP, with up to three for failover.", "p": "p.101", "id": "q01-11"}, {"c": "01", "q": "Which FortiAP model suffix indicates Wi-Fi 6E?", "o": ["F", "G", "K", "E"], "k": [1], "w": "G is Wi-Fi 6E (for example 231G). F is Wi-Fi 6 and K is Wi-Fi 7.", "p": "p.75", "id": "q01-12"}, {"c": "02", "q": "An SSID was created in bridge mode, and now the team wants tunnel mode. What must happen?", "o": ["Edit the SSID and change the traffic mode field", "Recreate the SSID, since mode is set at creation", "Change the mode in the FortiAP profile radio", "Enable split tunneling on the existing SSID"], "k": [1], "w": "Traffic mode must be defined at the time of initial SSID configuration.", "p": "p.119", "id": "q02-1"}, {"c": "02", "q": "Which two statements about tunnel mode SSIDs are correct? (Choose two.)", "o": ["Each SSID gets its own interface and subnet", "Traffic stays local and only control reaches FortiGate", "Security profiles need a per-AP FortiGuard license", "Wi-Fi is lost if the controller goes down"], "k": [0, 3], "w": "Tunnel SSIDs are L3 interfaces with their own subnet, and they depend on the controller.", "p": "p.120", "id": "q02-2"}, {"c": "02", "q": "Which bridge mode feature needs a FortiGuard subscription on each AP?", "o": ["VLAN pooling on the SSID", "Security profiles inspected on the FortiAP", "Dynamic VLAN from a RADIUS attribute", "Captive portal with certificate auth"], "k": [1], "w": "Bridge mode AV, IPS, web filter, and app control run on supported FortiAPs with a per-AP subscription.", "p": "p.123", "id": "q02-3"}, {"c": "02", "q": "During a mesh build, the leaf FortiAP never shows up under the root. Which step is most likely missing?", "o": ["Enabling DTLS on the CAPWAP data channel", "Setting the root AP to bridge mode uplink", "Adding the leaf to a VLAN pool on the SSID", "Broadcasting the mesh SSID in the root AP profile"], "k": [3], "w": "The mesh SSID has to be manually broadcast through the root AP's FortiAP profile.", "p": "p.126", "id": "q02-4"}, {"c": "02", "q": "Which EAP method requires a valid certificate on every client device?", "o": ["EAP-TLS", "PEAPv0/MSCHAPv2", "EAP-TTLS", "PEAPv1/EAP-GTC"], "k": [0], "w": "EAP-TLS uses certificates on both client and server and needs a PKI.", "p": "p.134", "id": "q02-5"}, {"c": "02", "q": "Which WPA2 key encrypts broadcast and multicast traffic?", "o": ["PMK", "PTK", "GTK", "GMK"], "k": [2], "w": "The GTK covers broadcast and multicast. The PTK covers unicast.", "p": "p.138", "id": "q02-6"}, {"c": "02", "q": "A client roams from one AP to another on the same WPA2 SSID. What happens?", "o": ["The GTK is reused and no frames are exchanged", "Only the SAE commit frames are repeated", "The PMK is regenerated from the passphrase", "A new four-way handshake takes place"], "k": [3], "w": "The four-way handshake occurs again whenever a client roams.", "p": "p.138", "id": "q02-7"}, {"c": "02", "q": "What does WPA3-Personal use instead of a PSK exchange?", "o": ["SAE (Dragonfly Key Exchange)", "PEAP with a server certificate", "TKIP with a 64-bit MIC", "OWE with no password at all"], "k": [0], "w": "WPA3-Personal uses SAE, based on RFC 7664.", "p": "p.139", "id": "q02-8"}, {"c": "02", "q": "Enabling MPSK on an existing WPA2-Personal SSID has what effect on the old passphrase?", "o": ["It becomes the default MPSK group key", "It is kept for clients that don't support MPSK", "It is dropped and no longer works", "It moves to a second SSID automatically"], "k": [2], "w": "When MPSK is enabled, the previous single passphrase is dropped.", "p": "p.147", "id": "q02-9"}, {"c": "02", "q": "FortiGate does 802.1X with local users and acts as the RADIUS server. Which EAP method is supported?", "o": ["EAP-TLS only", "EAP-TTLS only", "PEAP only", "PEAP and EAP-TLS"], "k": [2], "w": "Local 802.1X is valid only for PEAP.", "p": "p.151", "id": "q02-10"}, {"c": "02", "q": "WSSO isn't putting users in the right policy. FortiAuthenticator returns Fortinet-Group-Name = staff, and the FortiGate group is Staff. What's wrong?", "o": ["WSSO needs vendor ID 12345 on the server", "The group name is case sensitive and differs", "WSSO only works with bridge mode SSIDs", "The attribute must be Filter-Id, not a VSA"], "k": [1], "w": "The group name value is case sensitive and must match exactly.", "p": "p.153", "id": "q02-11"}, {"c": "02", "q": "Which captive portal type works on both tunnel and bridge SSIDs?", "o": ["Disclaimer Only", "Disclaimer + Authentication", "Email Collection", "Authentication"], "k": [3], "w": "Only Authentication is listed for both tunnel and bridge.", "p": "p.155", "id": "q02-12"}, {"c": "03", "q": "Two clients on the same bridge mode SSID but different FortiAPs can still reach each other with Block intra-SSID traffic enabled. What fixes this?", "o": ["Enable private VLAN on the FortiSwitch", "Move the SSID to a different VLAN pool", "Disable SSID broadcast on both FortiAPs", "Raise the maximum clients on the SSID"], "k": [0], "w": "In bridge mode, blocking is per AP. Private VLAN on the FortiSwitch blocks traffic across APs.", "p": "p.165", "id": "q03-1"}, {"c": "03", "q": "Which RADIUS attribute carries the VLAN ID or VLAN name for dynamic VLAN assignment?", "o": ["IETF 64 Tunnel-Type", "IETF 81 Tunnel-Private-Group-Id", "IETF 65 Tunnel-Medium-Type", "Fortinet-Group-Name VSA"], "k": [1], "w": "IETF 81 carries the VLAN ID or name. 64 and 65 identify the response as VLAN/802.", "p": "p.174", "id": "q03-2"}, {"c": "03", "q": "A user authenticates on a dynamic VLAN SSID, but the RADIUS server returns no VLAN attributes. Where does the client land?", "o": ["It is rejected until attributes are sent", "On the quarantine VLAN created by FortiGate", "On the SSID default VLAN ID", "On the first VLAN in the VLAN pool"], "k": [2], "w": "If RADIUS doesn't specify a VLAN, the user goes to the SSID's default VLAN.", "p": "p.175", "id": "q03-3"}, {"c": "03", "q": "Which two statements about VLAN pooling are correct? (Choose two.)", "o": ["Load balancing pools work only on tunnel mode SSIDs", "Pool VLANs get DHCP and IP settings automatically", "Round robin gives new clients the least busy VLAN", "Hash uses the client MAC and the AP serial number"], "k": [0, 2], "w": "Load balancing is tunnel only, and round robin picks the VLAN with the fewest clients. You set interface settings manually.", "p": "p.178", "id": "q03-4"}, {"c": "03", "q": "An SSID interface is named Campus with load balancing VLANs. What zone does FortiOS create?", "o": ["Campus-vlan-zone", "zone.Campus", "Campus_pool", "Campus.zone"], "k": [3], "w": "The zone is the SSID interface name followed by .zone.", "p": "p.180", "id": "q03-5"}, {"c": "03", "q": "Wireless NAC is enabled on an SSID. What does a device get when it first connects?", "o": ["The onboarding VLAN in the NAC profile", "The VLAN from its last NAC policy match", "The SSID static VLAN ID", "The quarantine VLAN until it is matched"], "k": [0], "w": "New devices start on the onboarding VLAN set in the NAC profile.", "p": "p.188", "id": "q03-6"}, {"c": "03", "q": "A NAC-matched device disconnects and rejoins the same SSID after 6 minutes, with no policy changes. Which VLAN does it get?", "o": ["The onboarding VLAN again", "A new VLAN from round robin", "Its previously assigned VLAN", "The default VLAN of the AP group"], "k": [2], "w": "Within 10 minutes on the same SSID with no policy change, it keeps the previous VLAN.", "p": "p.188", "id": "q03-7"}, {"c": "03", "q": "How often does FortiGate reevaluate the VLAN of a connected NAC-matched device?", "o": ["Every 60 seconds", "Every 10 minutes", "Only when it reconnects", "Every 120 seconds"], "k": [3], "w": "Connected devices are reevaluated every 120 seconds.", "p": "p.188", "id": "q03-8"}, {"c": "03", "q": "Which CLI command shows devices matched by wireless NAC policies on the controller?", "o": ["diagnose wireless-controller nac-list", "wlac_hlp -c sta-nac", "get wireless-controller nac-device", "wlac_hlp -c nacprof"], "k": [1], "w": "sta-nac shows matched devices. nacprof lists NAC profiles.", "p": "p.189", "id": "q03-9"}, {"c": "03", "q": "Quarantine is enabled on an SSID. What does FortiGate create automatically?", "o": ["A soft switch, interface, DHCP, and captive portal", "A quarantine VLAN on every FortiSwitch port", "A firewall policy allowing DNS to the internet", "An automation stitch for FortiAnalyzer IOC"], "k": [0], "w": "FortiGate creates the soft switch, interface, DHCP server, and captive portal. No policy is created by default.", "p": "p.197", "id": "q03-10"}, {"c": "03", "q": "Why can't a bridge mode SSID be used for wireless client quarantine?", "o": ["Bridge SSIDs cannot run a captive portal", "Quarantine requires a per-AP FortiGuard license", "Only tunnel mode SSIDs can be quarantined", "Bridge SSIDs aren't part of the Security Fabric"], "k": [2], "w": "The guide states only tunnel mode SSIDs can be quarantined.", "p": "p.196", "id": "q03-11"}, {"c": "03", "q": "Where do you release a quarantined wireless host?", "o": ["WiFi & Switch Controller > SSIDs", "Security Fabric > Automation", "Policy & Objects > Firewall Policy", "Dashboard > Assets & Identities > Quarantine"], "k": [3], "w": "The Quarantine widget manages and releases quarantined hosts.", "p": "p.198", "id": "q03-12"}, {"c": "04", "q": "An engineer wants one FortiAP to use a different transmit power than the others sharing its profile. What is the supported approach?", "o": ["Assign a second FortiAP profile to that AP", "Use a per-AP override on the CLI", "Move the AP into its own FortiAP group", "Set the power in the SSID for that AP"], "k": [1], "w": "Per-AP overrides are done on the CLI under wireless-controller wtp. An AP can't have two profiles.", "p": "p.209", "id": "q04-1"}, {"c": "04", "q": "After FortiGate manages a FortiAP, you can't reach its GUI over HTTPS. Why?", "o": ["Managed APs drop direct admin access by default", "HTTPS is only enabled on FortiAP-U models", "The AP needs a FortiGuard license for the GUI", "The AP now uses HTTP on TCP 8080 instead"], "k": [0], "w": "Managed APs drop direct HTTPS and SSH by default. Enable it in the profile or per AP.", "p": "p.211", "id": "q04-2"}, {"c": "04", "q": "A Wi-Fi 6E FortiAP profile is set to Dual 5G. What is lost?", "o": ["The 6 GHz radio's 320 MHz channel option", "Frequency handoff on the 5 GHz radios", "A dedicated radio for RF and threat scanning", "The ability to broadcast bridge SSIDs"], "k": [2], "w": "With Dual 5G, FortiAP can't have a dedicated scanning radio.", "p": "p.210", "id": "q04-3"}, {"c": "04", "q": "Which 2.4 GHz channel plans can be selected in a FortiAP profile?", "o": ["1, 6, 11 or 1, 5, 9, 13", "1, 6, 11 only", "1, 4, 8, 11 only", "1, 6, 11 or 1, 4, 8, 11"], "k": [3], "w": "Three Channels (1, 6, 11) or Four Channels (1, 4, 8, 11).", "p": "p.213", "id": "q04-4"}, {"c": "04", "q": "Users report short drops at random times, and logs show channel changes. Which feature is the most likely cause?", "o": ["DARRP adjusting channel or power", "WIDS background scanning", "Frequency handoff on 5 GHz", "Short guard interval enabled"], "k": [0], "w": "DARRP can cause temporary disconnections during channel or transmit power changes.", "p": "p.217", "id": "q04-5"}, {"c": "04", "q": "What is the default DARRP optimization interval?", "o": ["3600 seconds", "600 seconds", "43200 seconds", "86400 seconds"], "k": [3], "w": "DARRP runs every 24 hours (86400 seconds) by default.", "p": "p.217", "id": "q04-6"}, {"c": "04", "q": "Transmit power mode is Auto with defaults. Interference is detected from a neighboring AP. What happens?", "o": ["Power is set to 100 percent of the regional max", "Power drops toward the auto-power-low value", "The radio switches to dedicated monitor mode", "DARRP is forced to run immediately"], "k": [1], "w": "With interference, the controller lowers power toward auto-power-low.", "p": "p.220", "id": "q04-7"}, {"c": "04", "q": "Which two statements about AP handoff are correct? (Choose two.)", "o": ["It is enabled by default on all FortiAP profiles", "An overloaded AP replies with status code 17", "Thresholds are set only on the CLI", "handoff-sta-thresh is the hard client limit"], "k": [1, 2], "w": "Status code 17 signals the AP is busy, and thresholds are CLI only. It's disabled by default and max-client is the hard limit.", "p": "p.228", "id": "q04-8"}, {"c": "04", "q": "handoff-rssi is 30. What signal must a nearby AP see for the client?", "o": ["-30 dBm or better", "-70 dBm or better", "-65 dBm or better", "-95 dBm or better"], "k": [2], "w": "The value is relative to -95 dBm, so 30 means -65 dBm.", "p": "p.228", "id": "q04-9"}, {"c": "04", "q": "Frequency handoff isn't steering clients to 5 GHz. What must be true for it to learn client capability?", "o": ["It must be enabled on the 5 or 6 GHz radio", "It must be enabled in the WIDS profile", "The SSID must be in bridge mode", "DARRP must be disabled on 2.4 GHz"], "k": [0], "w": "Frequency handoff must be enabled on the 5 or 6 GHz band to learn client capability.", "p": "p.231", "id": "q04-10"}, {"c": "04", "q": "Which setting is required for both manual and automatic on-wire rogue AP suppression?", "o": ["Auto-suppress rogue APs in foreground scan", "A FortiAP-U model with a FortiGuard license", "Frequency handoff on the monitoring radio", "A radio in dedicated monitor mode"], "k": [3], "w": "Suppression needs a dedicated monitor radio, sensor mode, and rogue AP detection. Auto-suppress is only for automatic.", "p": "p.237", "id": "q04-11"}, {"c": "04", "q": "What is the default long duration attack threshold in a WIDS profile?", "o": ["1000 microseconds", "32,767 microseconds", "8200 microseconds", "600 microseconds"], "k": [2], "w": "Range 1000 to 32,767, default 8200.", "p": "p.238", "id": "q04-12"}, {"c": "05", "q": "A FortiAP serves clients and occasionally checks for other APs on its own band. Which scanning method is this?", "o": ["Dedicated monitor", "Background scanning", "Foreground scanning", "Spectrum analysis"], "k": [1], "w": "Background scanning is opportunistic, during idle time, on the radio's band only.", "p": "p.247", "id": "q05-1"}, {"c": "05", "q": "By default, how often does a background scan period start?", "o": ["Every 600 seconds", "Every 20 milliseconds", "Every 86400 seconds", "Every 60 seconds"], "k": [0], "w": "A scan period starts every 600 seconds, 20 ms per channel.", "p": "p.247", "id": "q05-2"}, {"c": "05", "q": "You want to suppress rogue APs. Which configuration is required?", "o": ["Background scanning on both client radios", "Marking the AP as Rogue in the monitor", "A radio in dedicated monitor mode", "A FortiAP group with the rogue's MAC"], "k": [2], "w": "Suppression needs a dedicated monitor radio and isn't possible with background scanning.", "p": "p.252", "id": "q05-3"}, {"c": "05", "q": "A rogue is a consumer wireless router doing NAT, so client MACs never appear on the wire. Which detection method can still flag it?", "o": ["Exact MAC address match", "Background scanning only", "Null SSID probe detection", "MAC adjacency"], "k": [3], "w": "MAC adjacency matches the router's similar wired and wireless MACs.", "p": "p.251", "id": "q05-4"}, {"c": "05", "q": "What is the default rogue-scan-mac-adjacency value?", "o": ["31", "7", "0", "16"], "k": [1], "w": "Default 7, range 0 to 31.", "p": "p.251", "id": "q05-5"}, {"c": "05", "q": "An admin marks an AP as Rogue in Dashboard > WiFi > Rogue APs. Users can still connect to it. Why?", "o": ["Marking only tracks it; Suppressed Rogue AP is needed", "The AP must first be marked Accepted, then Rogue", "Rogue status only applies after a FortiGate reboot", "Rogue marking only works for 6 GHz radios"], "k": [0], "w": "Accepted and Rogue labels are for tracking. Choose Suppressed Rogue AP to block it.", "p": "p.253", "id": "q05-6"}, {"c": "05", "q": "Which two are requirements for on-wire rogue detection to flag an AP? (Choose two.)", "o": ["The rogue AP must use the same SSID as yours", "A client must be connected and sending traffic", "The rogue must broadcast in the 6 GHz band", "FortiAP must see client MACs on the wired side"], "k": [1, 3], "w": "At least one active client is needed, and its MAC must be seen on the wire (via ARP).", "p": "p.250", "id": "q05-7"}, {"c": "05", "q": "Why configure a foreground scan channel list in a WIDS profile?", "o": ["To stop DARRP from changing channels", "To block rogues on channels not in the list", "To shorten the scan cycle and report more often", "To force clients onto the listed channels"], "k": [2], "w": "Fewer channels mean a shorter dwell cycle and more frequent reporting.", "p": "p.249", "id": "q05-8"}, {"c": "05", "q": "During suppression, what does the controller send to the rogue AP itself?", "o": ["CAPWAP join requests as a managed AP", "Beacons with the rogue's SSID hidden", "Association responses with status code 17", "Deauthentication frames mimicking its clients"], "k": [3], "w": "It mimics the rogue's clients and sends deauth to the rogue AP, and mimics the rogue toward its clients.", "p": "p.252", "id": "q05-9"}, {"c": "05", "q": "What should you check before enabling rogue AP suppression?", "o": ["Laws and regulations in your region", "That DARRP is set to 3600 seconds", "That all SSIDs are in bridge mode", "That the AP has a FortiGuard license"], "k": [0], "w": "The guide says to verify suppression complies with local laws and regulations.", "p": "p.252", "id": "q05-10"}, {"id": "q06-1", "c": "06", "q": "Where do you assign a FortiAP configuration profile?", "o": ["In the SSID interface settings", "In the WIDS profile", "In the managed FortiAP settings", "In the syslog profile"], "k": [2], "w": "FortiAP configuration profiles are assigned in managed FortiAP settings. QoS and L3 firewall go on the SSID.", "p": "p.259"}, {"id": "q06-2", "c": "06", "q": "You use an external captive portal server. Exempt destinations are set on the SSID, but clients still can't load the portal. What's missing?", "o": ["A matching firewall policy on the captive portal interface", "A WIDS profile on the radio serving the SSID", "A Bonjour profile on the FortiAP profile", "Email Collection in Feature Visibility"], "k": [0], "w": "It's a two-step process: exempt on the SSID, then a firewall policy for the pinhole.", "p": "p.268"}, {"id": "q06-3", "c": "06", "q": "Guests reach the internet without ever seeing the captive portal. Which policy setting most likely causes this?", "o": ["The source user group is the guest group", "NAT is enabled on the guest to WAN policy", "Exempt from Captive Portal is on the guest policy", "The guest SSID is in tunnel mode"], "k": [2], "w": "Exempt from Captive Portal on the guest internet policy lets all traffic out without login.", "p": "p.270"}, {"id": "q06-4", "c": "06", "q": "In the external captive portal flow, who sends the RADIUS Access-Request to FortiAuthenticator?", "o": ["The client browser", "The FortiAP", "FortiAuthenticator to itself", "FortiGate"], "k": [3], "w": "The browser POSTs credentials to FortiGate, which sends the RADIUS Access-Request.", "p": "p.271"}, {"id": "q06-5", "c": "06", "q": "What is the default HTTPS authentication port on FortiGate?", "o": ["1000", "1003", "8443", "443"], "k": [1], "w": "1003, changed with auth-https-port under system global.", "p": "p.272"}, {"id": "q06-6", "c": "06", "q": "In the redirect URL FortiGate sends to an external portal, what is the magic value?", "o": ["The session ID", "The AP serial number", "The client MAC address", "The RADIUS shared secret"], "k": [0], "w": "The magic parameter is the session ID used to track the request.", "p": "p.274"}, {"id": "q06-7", "c": "06", "q": "Apple TVs are on VLAN 100 and staff are on VLAN 20. AirPlay discovery fails across VLANs. Which feature addresses this?", "o": ["L3 firewall profile", "QoS profile", "BLE profile", "Bonjour profile"], "k": [3], "w": "Bonjour profiles bridge mDNS service discovery across VLANs.", "p": "p.278"}, {"id": "q06-8", "c": "06", "q": "Which two statements about roaming-acct-interim-update are correct? (Choose two.)", "o": ["It needs WPA2 or WPA3 Enterprise", "It works on open and captive portal SSIDs", "It reuses the same Acct-Session-Id on roam", "It disables RADIUS accounting during roams"], "k": [0, 2], "w": "It's enterprise-only and sends Interim-Update with the same Acct-Session-Id.", "p": "p.279"}, {"id": "q06-9", "c": "06", "q": "Which Managed FortiAPs view is best for finding overloaded radios?", "o": ["AP view", "Group view", "Radio view", "Map view"], "k": [2], "w": "Radio view lets you sort radios by utilization and load.", "p": "p.283"}, {"id": "q06-10", "c": "06", "q": "A user says the Wi-Fi password is rejected. Which tool shows the association and authentication steps for that client?", "o": ["Dashboard > WiFi > Rogue APs", "WiFi Maps diagnostics on the AP icon", "The FortiAP REST API sys-perf call", "Client Diagnostics and Tools, Logs tab"], "k": [3], "w": "The client's Diagnostics and Tools Logs tab lists association and authentication steps, good for wrong PSKs.", "p": "p.285"}, {"id": "q06-11", "c": "06", "q": "Which FortiAP REST API call reboots the AP?", "o": ["GET /api/v1/sys-status", "POST /api/v1/reboot", "POST /api/v1/cfg-set", "GET /api/v1/wtp-cfg"], "k": [1], "w": "Reboot is a POST to /api/v1/reboot.", "p": "p.292"}, {"id": "q06-12", "c": "06", "q": "How do you change the syslog server port for FortiAP logs?", "o": ["In the syslog profile on the CLI", "In the FortiAP GUI under Local Configuration", "In Log & Report > Log Settings", "In the SSID advanced settings"], "k": [0], "w": "Set server-port under config wireless-controller syslog-profile.", "p": "p.296"}, {"id": "q07-1", "c": "07", "q": "What makes FortiAIOps a predictive troubleshooting tool?", "o": ["Machine learning on network behavior", "Security incident reporting to FortiGuard", "A dedicated monitor radio on every AP", "Static thresholds configured on FortiGate"], "k": [0], "w": "ML learns normal behavior and predicts issues.", "p": "p.306"}, {"id": "q07-2", "c": "07", "q": "What does FortiAIOps primarily rely on from the wireless controller?", "o": ["SNMP traps from each FortiAP", "Logs from the wireless controller", "RADIUS accounting from FortiAuthenticator", "NetFlow records from FortiSwitch"], "k": [1], "w": "The guide says FortiAIOps relies on logs from the wireless controller.", "p": "p.304"}, {"id": "q07-3", "c": "07", "q": "You add a FortiGate to FortiAIOps. What happens to the FortiAPs it controls?", "o": ["Each must be added by serial number", "They require a CSV import to appear", "They are added automatically", "They appear only after a SAM test"], "k": [2], "w": "FortiAPs and FortiSwitches controlled by the FortiGate are added automatically.", "p": "p.311"}, {"id": "q07-4", "c": "07", "q": "Which option adds many FortiGate controllers to FortiAIOps at once?", "o": ["ADD with a range of serials", "Asset Sync from FortiCloud", "Discovery over CAPWAP", "IMPORT with a CSV file"], "k": [3], "w": "IMPORT adds multiple controllers from a CSV.", "p": "p.311"}, {"id": "q07-5", "c": "07", "q": "Which FortiAIOps feature runs scheduled connectivity and throughput tests from FortiAPs?", "o": ["Wireless SAM", "Channel Summary", "AI Insights heatmap", "Managed FortiGates"], "k": [0], "w": "SAM schedules measurements and threshold tests of connectivity and throughput.", "p": "p.308"}, {"id": "q07-6", "c": "07", "q": "Where in FortiAIOps would you check a client's roaming history between APs?", "o": ["Wireless > Channel Summary", "Dashboard > Summary", "Inventory > Managed FortiGates", "Wireless > Clients, View Details"], "k": [3], "w": "Client View Details includes roaming history.", "p": "p.312"}, {"id": "q07-7", "c": "07", "q": "Which two items does the FortiAIOps Rogue APs view show? (Choose two.)", "o": ["Which FortiAP first detected the rogue", "The rogue AP's admin password", "Whether the rogue is on the wired network", "The rogue AP's DARRP profile"], "k": [0, 2], "w": "It shows the detecting FortiAP and whether the rogue is connected to the wired network.", "p": "p.313"}, {"id": "q07-8", "c": "07", "q": "Which view gives a per-channel health score with noise and client counts?", "o": ["Wireless > Access Points", "Wireless > Channel Summary", "Dashboard > Summary", "Wireless > Rogue APs"], "k": [1], "w": "Channel Summary shows clients, radios, data speed, noise, and a health score per channel.", "p": "p.313"}, {"id": "q08-1", "c": "08", "q": "Which metric is a measure of wireless health rather than capacity?", "o": ["Channel utilization", "Association count", "Link rates", "Data throughput"], "k": [2], "w": "Health covers noise, signal, link rates, retries, loss. Capacity covers utilization, association count, throughput.", "p": "p.329"}, {"id": "q08-2", "c": "08", "q": "A client shows strong signal strength but a very low link rate while transferring data. What is the most likely issue?", "o": ["The client is too far from the AP", "High noise is reducing the SNR", "The channel utilization is under 75%", "The SSID is in bridge mode"], "k": [1], "w": "Good signal with a low link rate points to noise lowering the SNR.", "p": "p.323"}, {"id": "q08-3", "c": "08", "q": "A school's radios serve clients streaming video. What client count per radio should the design aim for?", "o": ["50", "75", "100", "30"], "k": [3], "w": "About 30 for high-bandwidth clients such as education, 50 for basic use.", "p": "p.332"}, {"id": "q08-4", "c": "08", "q": "Channel utilization regularly exceeds 75%, mostly from neighbor networks. What does the guide recommend?", "o": ["Change your channel", "Enable short guard interval", "Raise transmit power to auto", "Add a second SSID"], "k": [0], "w": "Add capacity, or change channel if neighbors generate the utilization.", "p": "p.332"}, {"id": "q08-5", "c": "08", "q": "Which interference type usually needs specialized equipment to locate?", "o": ["Coherent co-channel interference", "Adjacent channel Wi-Fi interference", "Non-coherent interference", "Interference from your own APs"], "k": [2], "w": "Non-coherent, non-Wi-Fi energy can't be analyzed by most APs and clients.", "p": "p.334"}, {"id": "q08-6", "c": "08", "q": "A healthy interface should have which SNR?", "o": ["5 minimum, 10 preferred", "15 minimum, 25 or more preferred", "25 minimum, 40 or more preferred", "30 minimum, 50 or more preferred"], "k": [1], "w": "SNR should be 15 at minimum, 25 or more preferred.", "p": "p.336"}, {"id": "q08-7", "c": "08", "q": "Which noise floor reading is the best?", "o": ["-72 dBm", "-81 dBm", "-86 dBm", "-93 dBm"], "k": [3], "w": "-92 or weaker is ideal. High -80s is OK, low -80s and -70s indicate interference.", "p": "p.336"}, {"id": "q08-8", "c": "08", "q": "A client can join a temporary open SSID on the same AP but not the WPA2 SSID, and the PSK was verified. Where should troubleshooting focus?", "o": ["RF interference on the channel", "AP overloading on the radio", "DARRP channel changes", "Client configuration or compatibility"], "k": [3], "w": "If open works and credentials are correct, RF isn't the issue.", "p": "p.337"}, {"id": "q08-9", "c": "08", "q": "Which two statements describe a WPA2-PSK mismatch in diagnose wireless-controller wlac sta_filter output? (Choose two.)", "o": ["invalid MIC in msg 2/4 repeats", "DHCP Ack is sent before the handshake", "WPA_PTK DISCONNECTED then appears", "assoc_resp shows status code 17"], "k": [0, 2], "w": "The MIC fails at message 2/4, repeats, then the PTK is disconnected and the client denied.", "p": "p.340"}, {"id": "q08-10", "c": "08", "q": "What is the primary function of SAM?", "o": ["Uses overlay sensors to analyze RF", "Runs tests to predict wireless issues", "Suppresses rogue APs on the wire", "Assigns VLANs from a pool"], "k": [1], "w": "SAM performs predictive health checks without overlay sensors.", "p": "p.343"}, {"id": "q08-11", "c": "08", "q": "The SSID under SAM test uses a captive portal. What must be set on the SAM-mode FortiAP?", "o": ["sam-captive-portal enable with credentials", "sam-security-type open", "iperf-protocol udp", "sam-report-intv 0"], "k": [0], "w": "Enable sam-captive-portal to connect to SSIDs with a captive portal, with username and password.", "p": "p.342"}, {"id": "q09-1", "c": "09", "q": "You need to capture 2.4 GHz and 5 GHz client traffic at the same time. What is required?", "o": ["One FortiAP with both radios in sniffer mode", "Two FortiAP devices, one per band", "A single radio with ap-sniffer-chan set to 0", "A FortiAP in SAM mode on both bands"], "k": [1], "w": "A radio captures one frequency at a time. Use two FortiAPs to capture both frequencies.", "p": "p.349"}, {"id": "q09-2", "c": "09", "q": "Where does FortiAP store the wireless capture, and when must you copy it off?", "o": ["/tmp/wl_sniff.cap, before a reboot or radio change", "/var/log/sniff.pcap, before the next DARRP run", "/data/capture.cap, within 24 hours", "/tmp/wl_sniff.cap, only after a factory reset"], "k": [0], "w": "It's stored temporarily in /tmp/wl_sniff.cap and must be moved with ftftp before reboot or radio changes.", "p": "p.349"}, {"id": "q09-3", "c": "09", "q": "How is a FortiAP radio placed in sniffer mode?", "o": ["In the FortiAP profile GUI radio mode list", "From the FortiAP local GUI", "Through FortiExplorer over BLE", "On the FortiGate CLI with set mode sniffer"], "k": [3], "w": "Sniffer mode is configurable through the CLI only.", "p": "p.350"}, {"id": "q09-4", "c": "09", "q": "Which controller command shows client load over multiple hours and days?", "o": ["get wireless-controller scan", "get wireless-controller rf-analysis", "get wireless-controller status", "diag wireless-controller wlac -d sta"], "k": [2], "w": "get wireless-controller status shows client load over time.", "p": "p.352"}, {"id": "q09-5", "c": "09", "q": "A remote FortiAP sits behind NAT, and SSH isn't reachable. Which access method still works?", "o": ["The CAPWAP tunnel from the controller", "A console cable from headquarters", "FortiExplorer over the internet", "Direct HTTPS to the AP public IP"], "k": [0], "w": "CAPWAP tunnel access is useful when the AP is remote behind NAT.", "p": "p.353"}, {"id": "q09-6", "c": "09", "q": "Which FortiAP command shows both upstream and downstream link rates for associated clients?", "o": ["cw_diag -c his-chutil", "iwconfig", "cw_diag -c all-chutil", "cw_diag ksta"], "k": [3], "w": "cw_diag ksta (alias sta) lists upstream and downstream link rates.", "p": "p.356"}, {"id": "q09-7", "c": "09", "q": "On a FortiAP, interface wlan12 belongs to which band?", "o": ["2.4 GHz", "5 GHz", "6 GHz", "It depends on the SSID count"], "k": [1], "w": "X = 1 means 5 GHz. Y (2) is the SSID index.", "p": "p.357"}, {"id": "q09-8", "c": "09", "q": "Which two statements about CAPWAP tunnel CLI sessions to FortiAP are correct? (Choose two.)", "o": ["Results appear as the command runs", "A new command cancels the previous one", "The default output size is 32K", "Output is unlimited for diag commands"], "k": [1, 2], "w": "Results return after completion, a new command cancels the old one, default 32K, max 4M.", "p": "p.353"}, {"id": "q09-9", "c": "09", "q": "A client is connected but shows a 169.254 address. What is the most common cause per the guide?", "o": ["MAC address randomization on the client", "Too many SSIDs on the AP", "DHCP scope exhaustion", "WPA3 transition mode mismatch"], "k": [2], "w": "DHCP scope exhaustion is one of the most common causes.", "p": "p.364"}, {"id": "q09-10", "c": "09", "q": "One AP broadcasts 10 SSIDs. About how much airtime goes to management frames?", "o": ["32 percent", "3 percent", "10 percent", "64 percent"], "k": [0], "w": "The guide's table shows about 32 percent for one AP with 10 SSIDs. Best practice is five or fewer.", "p": "p.366"}, {"id": "q09-11", "c": "09", "q": "Lost frames for one client in cw_diag -d sta are climbing. What does that suggest?", "o": ["The client roamed to another AP", "Retries are normal and can be ignored", "The AP is in sniffer mode", "The client can't decode AP frames well"], "k": [3], "w": "Rising lost frames show the AP couldn't deliver frames after retries, suggesting poor signal at the client or high noise.", "p": "p.355"}], "exams": {"A": [{"c": "04", "q": "A Wi-Fi 6E FortiAP profile must keep a radio dedicated to wireless threat scanning. Which setting conflicts with that goal?", "o": ["Transmit power mode set to Auto", "Radio resource provision enabled", "Short guard interval left disabled", "Dual 5G operation mode"], "k": [3], "w": "In Dual 5G mode, FortiAP can't have a dedicated scanning radio.", "p": "p.210", "id": "xA-1"}, {"c": "02", "q": "A branch has a 100 Mbps WAN link to the FortiGate controller. Users need high local throughput to a file server on the branch LAN. Which SSID mode suits this best?", "o": ["Tunnel mode", "Mesh mode", "Captive portal mode", "Bridge mode"], "k": [3], "w": "Bridge mode keeps traffic local at the AP. Only CAPWAP control goes to the controller.", "p": "p.122", "id": "xA-2"}, {"c": "05", "q": "A rogue device is a wireless router doing NAT. Which setting affects how close its wired and wireless MACs must be to match?", "o": ["rogue-scan-mac-adjacency", "darrp-optimize", "handoff-rssi", "ap-scan-channel-list-2G-5G"], "k": [0], "w": "rogue-scan-mac-adjacency (default 7, range 0 to 31) sets the max MAC difference.", "p": "p.251", "id": "xA-3"}, {"c": "03", "q": "Quarantine is enabled on a tunnel SSID. A quarantined client can't reach a remediation server. What is missing?", "o": ["An automation stitch that reacts to FortiAnalyzer IOC verdict events", "A FortiSwitch quarantine VLAN on the AP port", "A second captive portal on the quarantine soft switch", "A firewall policy allowing access from the quarantine interface"], "k": [3], "w": "FortiGate auto-creates the quarantine resources but no policy. You must add limited-access policies.", "p": "p.196", "id": "xA-4"}, {"c": "05", "q": "Why is background scanning a poor choice for detecting rogue APs quickly?", "o": ["It scans all bands but cannot report MAC addresses", "It disables client service for 600 seconds at a time", "It scans only in idle time and only the radio's band", "It needs a FortiGuard license for each scanning radio"], "k": [2], "w": "Background scans are opportunistic, scan only the radio's band, and are slower.", "p": "p.247", "id": "xA-5"}, {"c": "04", "q": "Which two settings are required for automatic suppression of on-wire rogue APs? (Choose two.)", "o": ["A radio in dedicated monitor mode", "Frequency handoff on the monitoring radio", "Auto-suppress rogue APs in foreground scan", "Background scanning every 600 seconds"], "k": [0, 2], "w": "Automatic suppression needs a dedicated monitor radio, sensor mode, rogue detection, and auto-suppress.", "p": "p.237", "id": "xA-6"}, {"c": "01", "q": "A company ships FortiAPs to teleworkers. Each AP must find the corporate FortiGate over the internet with failover. What is the recommended approach?", "o": ["Point each AP at apctrl1.fortilcloud.com", "Configure up to three static controller IPs on each AP", "Rely on broadcast discovery from the AP subnet", "Use DHCP option 138 handed out by each teleworker home router"], "k": [1], "w": "For connection over WAN, configure each FortiAP with the static controller IP, up to three for failover.", "p": "p.98", "id": "xA-7"}, {"c": "02", "q": "Which two statements about WPA3-Personal SAE are correct? (Choose two.)", "o": ["It reuses the WPA2 PSK exchange with a longer key", "It resists offline dictionary attacks", "It requires a RADIUS server for each client", "It derives the PMK without using the passphrase directly"], "k": [1, 3], "w": "SAE uses Dragonfly, resists dictionary attacks, and no longer uses the passphrase itself to derive the PMK.", "p": "p.139", "id": "xA-8"}, {"c": "05", "q": "What does FortiGate send to suppress a rogue AP's clients?", "o": ["Beacons that advertise a stronger copy of the SSID", "ARP replies that poison the clients' gateway", "CAPWAP reset messages to the rogue AP", "Deauthentication frames that mimic the rogue AP"], "k": [3], "w": "The controller impersonates the rogue AP and sends deauth frames to its clients, and the reverse.", "p": "p.252", "id": "xA-9"}, {"c": "06", "q": "In the external captive portal flow, what happens right after FortiGate receives the Access-Accept?", "o": ["The client is redirected to the FortiAuthenticator portal", "FortiGate sends a second Access-Request with the MAC", "FortiAuthenticator posts the credentials to FortiGate", "FortiGate sends a RADIUS Accounting-Request"], "k": [3], "w": "Access-Accept, then Accounting-Request and Response, then redirect to the original URL.", "p": "p.271", "id": "xA-10"}, {"c": "08", "q": "Users on one radio report slow Wi-Fi. The radio has 55 clients, most of them streaming video. What does the guide's sizing guidance say?", "o": ["Aim for about 50 clients per radio for any client type", "Client count matters only once utilization passes 90%", "Aim for about 75 clients per radio on 5 GHz radios", "Aim for about 30 clients per radio for streaming clients"], "k": [3], "w": "About 30 per radio for large file or streaming clients, about 50 for basic use.", "p": "p.332", "id": "xA-11"}, {"c": "03", "q": "A NAC policy is edited while devices are matched to it. What does FortiGate do?", "o": ["Deletes and reevaluates all previously matched devices", "Moves all matched devices to the quarantine VLAN", "Waits 10 minutes before applying the change", "Keeps every matched device in place until it disconnects"], "k": [0], "w": "If the NAC policy changes, matched devices are deleted and reevaluated.", "p": "p.186", "id": "xA-12"}, {"c": "09", "q": "Which controller command lists the neighboring APs FortiAPs have discovered, with channel and signal?", "o": ["get wireless-controller status", "get wireless-controller scan", "get wireless-controller wtp-status all", "diag wireless-controller wlac -d sta"], "k": [1], "w": "get wireless-controller scan lists discovered neighbor APs.", "p": "p.352", "id": "xA-13"}, {"c": "02", "q": "In 802.1X with FortiAuthenticator as the RADIUS server, what does the FortiGate authenticator need to know about the EAP method?", "o": ["The client certificate, to validate EAP-TLS", "The MSCHAPv2 hash, to check the password", "Nothing, because EAP is tunneled to the server", "The EAP type, to select the right certificate"], "k": [2], "w": "The authenticator needs no certificate or EAP knowledge. EAP is tunneled over RADIUS.", "p": "p.131", "id": "xA-14"}, {"c": "03", "q": "Dynamic VLAN assignment is configured, but users land on the wrong subnet. Which RADIUS attribute value should you check first?", "o": ["Fortinet-Group-Name", "Tunnel-Private-Group-Id", "Tunnel-Medium-Type", "Tunnel-Type"], "k": [1], "w": "IETF 81 Tunnel-Private-Group-Id carries the VLAN ID or name.", "p": "p.174", "id": "xA-15"}, {"c": "00", "q": "An AP's 5 GHz radio reports a client at good signal strength, but the client's link rate is low while it is actively transferring data. Which factor most likely explains this?", "o": ["The SNR is low because the noise floor has risen", "The AP beacon interval is set to 100 ms", "The client is using a narrow 20 MHz channel on the 5 GHz band", "The SSID is broadcast on both frequency bands"], "k": [0], "w": "Link rate depends on signal strength, SNR, and channel width. Good signal with a low rate points to a small SNR.", "p": "p.36", "id": "xA-16"}, {"c": "06", "q": "Wireless users need AirPlay to Apple TVs on a different VLAN. Where is the feature that bridges this service discovery?", "o": ["WiFi & Switch Controller > Connectivity Profiles", "WiFi & Switch Controller > Operation Profiles", "WiFi & Switch Controller > WIDS Profiles", "WiFi & Switch Controller > Protection Profiles"], "k": [0], "w": "Bonjour profiles are under Connectivity Profiles.", "p": "p.278", "id": "xA-17"}, {"c": "08", "q": "Why can't the controller show the signal strength the client receives from the AP?", "o": ["The client reports it only on the 6 GHz band in use", "The value is sent only to FortiAIOps for analysis", "The AP discards that value after association ends", "Only the client's network card can measure it"], "k": [3], "w": "The AP can't measure client signal quality. Only the client NIC can, and it isn't sent back.", "p": "p.321", "id": "xA-18"}, {"c": "08", "q": "Which metric is the primary indicator of wireless capacity around an interface?", "o": ["Channel utilization", "Downstream link rate", "Client signal strength", "Signal-to-noise ratio"], "k": [0], "w": "Channel utilization is the most important indicator of wireless capacity.", "p": "p.327", "id": "xA-19"}, {"c": "00", "q": "Which statement about 802.11 medium access is correct?", "o": ["Stations only need an ACK for broadcast frames sent", "Stations avoid collisions because they cannot detect them", "Stations transmit at once and the AP sorts the frames", "Stations detect collisions while transmitting and stop sending"], "k": [1], "w": "Wireless radios can't transmit and receive at once, so CSMA/CA avoids collisions instead of detecting them.", "p": "p.28", "id": "xA-20"}, {"c": "08", "q": "Which statement about SAM is correct?", "o": ["A FortiAP radio acts as a client and tests another AP's SSID", "SAM needs separate overlay sensors placed close to each AP radio", "SAM runs only in FortiAIOps, not on FortiGate", "SAM tests show only in the FortiAP local GUI"], "k": [0], "w": "SAM uses a FortiAP radio as a client to run ping and iPerf tests, with results in Wi-Fi event logs.", "p": "p.341", "id": "xA-21"}, {"c": "04", "q": "An administrator needs one FortiAP to use a different channel than the rest of its group. Which approach is supported?", "o": ["Create an SSID group with a custom channel", "Set the channel in the AP's WIDS profile", "Assign a second FortiAP profile to that AP", "Configure a per-AP override on the CLI"], "k": [3], "w": "Per-AP overrides are configured on the CLI under wireless-controller wtp.", "p": "p.209", "id": "xA-22"}, {"c": "00", "q": "A network designer plans 2.4 GHz channels for a three-AP office. Which plan avoids adjacent channel interference?", "o": ["Channels 6, 8, and 13", "Channels 3, 7, and 9", "Channels 1, 6, and 11", "Channels 1, 2, and 3"], "k": [2], "w": "Only three 2.4 GHz channels don't overlap: 1, 6, and 11.", "p": "p.57", "id": "xA-23"}, {"c": "01", "q": "An administrator connects a new FortiAP to a FortiGate port, but it never appears in Managed FortiAPs. The interface has DHCP enabled. What is the most likely missing setting?", "o": ["Auto firmware provisioning in WiFi Settings", "FMG-Access administrative access on the port", "Security Fabric Connection administrative access", "A FortiAP profile assigned directly to the physical interface"], "k": [2], "w": "CAPWAP requires Security Fabric Connection access on the interface the APs connect to.", "p": "p.86", "id": "xA-24"}, {"c": "02", "q": "During the WPA2 four-way handshake, which message delivers the encrypted GTK to the client?", "o": ["Message 2", "Message 4", "Message 3", "Message 1"], "k": [2], "w": "Message 3 installs the PTK and carries the MIC-encrypted GTK.", "p": "p.138", "id": "xA-25"}, {"c": "03", "q": "Which two are required for integrated wireless NAC on an SSID? (Choose two.)", "o": ["An onboarding VLAN with DHCP and device detection", "A FortiAnalyzer to supply the device verdicts", "A FortiSwitch port in NAC mode for each FortiAP", "A NAC policy that assigns a VLAN for matched devices"], "k": [0, 3], "w": "Wireless NAC needs an onboarding VLAN with DHCP and device detection, and a NAC policy to reassign matched devices.", "p": "p.184", "id": "xA-26"}, {"c": "01", "q": "A FortiAP connects through a layer 3 switch to a FortiGate in another subnet. There is no multicast routing. Which two discovery methods can locate the controller? (Choose two.)", "o": ["Broadcast discovery request", "DHCP option 138", "Static controller IP configured on the AP", "Multicast to 224.0.1.140"], "k": [1, 2], "w": "Across layer 3, use static, DNS, or DHCP. Broadcast doesn't cross subnets, and multicast needs multicast routing.", "p": "p.100", "id": "xA-27"}, {"c": "01", "q": "Which statement about the CAPWAP join process between FortiAP and FortiGate is correct?", "o": ["The AP must have a static controller IP before it can join", "A DTLS session is set up before the AP is authorized and joins", "The AP joins first and DTLS starts after the config is pushed", "FortiGate pushes the SSID config before sending a discovery reply"], "k": [1], "w": "Discovery, then a secure DTLS session, then authorization, then join, then config push.", "p": "p.86", "id": "xA-28"}, {"c": "06", "q": "An external captive portal on FortiAuthenticator loads, but logins fail and the browser can't post back to FortiGate. Which port must the browser reach on FortiGate by default?", "o": ["TCP 443", "TCP 1003", "UDP 1812", "TCP 8443"], "k": [1], "w": "The default HTTPS authentication port is 1003. The post parameter points to fgtauth on 1003.", "p": "p.272", "id": "xA-29"}, {"c": "04", "q": "DARRP is enabled. A microwave oven causes short bursts of interference several times a day. What is true?", "o": ["DARRP moves the radio to a clear channel within seconds of every burst", "DARRP may miss it, as it doesn't do continuous spectrum analysis", "DARRP turns the radio into a dedicated monitor", "DARRP lowers transmit power to auto-power-low at once"], "k": [1], "w": "DARRP doesn't do continuous spectrum analysis, so it may miss intermittent interferers.", "p": "p.217", "id": "xA-30"}, {"c": "04", "q": "An AP profile has handoff-sta-thresh 20 and max-client 30. A 21st client joins. What happens?", "o": ["Handoff logic tries to steer it to a nearby AP", "The client joins and no handoff is attempted", "All clients on the AP are reauthenticated", "The client is rejected with a hard limit"], "k": [0], "w": "Above handoff-sta-thresh the AP is busy and steers new clients. max-client is the hard reject.", "p": "p.228", "id": "xA-31"}, {"c": "08", "q": "Per the guide, which reading points to significant interference that warrants a spectrum analyzer?", "o": ["Noise floor in the low -80s or -70s dBm", "Signal strength at -60 dBm", "SNR of 28 dB on most clients", "Noise floor at -95 dBm or weaker"], "k": [0], "w": "Weaker than -92 is optimal, high -80s OK, low -80s or -70s indicate interference.", "p": "p.336", "id": "xA-32"}, {"c": "09", "q": "A client on a captive portal SSID is connected with a valid IP, but nothing loads and no login page appears. What is the most likely cause?", "o": ["The client is using a randomized private MAC address", "The DHCP scope for the SSID has been exhausted", "The browser hasn't triggered the captive portal", "The AP radio serving it switched into sniffer mode"], "k": [2], "w": "If the browser fails to trigger the portal, the client stays isolated with no login page.", "p": "p.365", "id": "xA-33"}, {"c": "02", "q": "FortiGate must apply different firewall policies to wireless users based on their FortiAuthenticator group. What must FortiAuthenticator return?", "o": ["Class attribute with the RADIUS client name", "Tunnel-Private-Group-Id with the group name", "Fortinet-Group-Name matching a FortiGate group name", "Filter-Id carrying the FortiGate firewall policy ID number"], "k": [2], "w": "WSSO uses the Fortinet-Group-Name VSA (vendor 12356), which must match a local group name exactly.", "p": "p.153", "id": "xA-34"}, {"c": "03", "q": "In a bridge mode SSID, Block intra-SSID traffic is on. Clients on different APs can still reach each other. Why?", "o": ["Bridge mode blocking only applies to IPv6", "Bridge mode blocking only applies per AP", "The SSID must also use VLAN pooling to block", "The FortiGate policy overrides the SSID setting"], "k": [1], "w": "In bridge mode the block is per AP. Private VLAN on FortiSwitch is needed across APs.", "p": "p.165", "id": "xA-35"}, {"c": "09", "q": "An AP is reachable only through its CAPWAP tunnel. A long diagnostic command is running when you send another. What happens?", "o": ["The first command is cancelled", "The CAPWAP tunnel restarts to clear both", "Both commands run and their output mixes", "The second command waits in a queue"], "k": [0], "w": "If a new command is sent before the previous one finishes, the previous one is cancelled.", "p": "p.353", "id": "xA-36"}, {"c": "09", "q": "Fortinet recommends which approach for over-the-air packet capture?", "o": ["A FortiGate diagnose sniffer on the SSID interface", "The production AP's serving radio switched to monitor", "The FortiAIOps spectrum analyzer on the controller", "An additional FortiAP used as a dedicated sniffer"], "k": [3], "w": "Use an additional AP as a dedicated sniffer to avoid changing network behavior.", "p": "p.349", "id": "xA-37"}, {"c": "07", "q": "Which data does FortiAIOps rely on from the wireless controller to detect anomalies?", "o": ["RADIUS accounting from FortiAuthenticator", "SNMP polls of every FortiAP radio", "Event logs forwarded from FortiGate", "Packet captures from sniffer radios"], "k": [2], "w": "FortiAIOps relies on logs from the wireless controller.", "p": "p.305", "id": "xA-38"}, {"c": "08", "q": "A client can't join a temporary open SSID published on the same AP as the secured SSID it fails on. What does this indicate?", "o": ["An incorrect RADIUS shared secret on FortiGate", "A supplicant setting wrong on the client device", "An RF issue or an AP overloading issue", "A wrong pre-shared key typed in by the user"], "k": [2], "w": "Failing to join an open network points to RF or AP overload, not authentication.", "p": "p.337", "id": "xA-39"}, {"c": "06", "q": "Which tool shows a client's association, authentication, and DHCP steps without using the CLI?", "o": ["Managed FortiAPs > Radio view columns", "WiFi Clients > Diagnostics and Tools > Logs", "Dashboard > WiFi > Login Failures widget", "WiFi Maps > FortiAP diagnostics view"], "k": [1], "w": "The client's Diagnostics and Tools Logs tab lists each connection step.", "p": "p.285", "id": "xA-40"}], "B": [{"c": "02", "q": "Which two statements about MPSK are correct? (Choose two.)", "o": ["Each MPSK group can map to its own VLAN", "Keys can be exported to a CSV file", "The original single PSK keeps working", "Each SSID can have several MPSK profiles"], "k": [0, 1], "w": "Groups can get VLANs and keys export to CSV. One MPSK profile per SSID, and the single PSK is dropped.", "p": "p.147", "id": "xB-1"}, {"c": "06", "q": "Which FortiAP REST API specification would you use to back up the AP configuration?", "o": ["WTP API", "CAPWAP API", "CMDB API", "Monitor API"], "k": [3], "w": "The Monitor API performs actions like restart, backup, and restore. CMDB modifies config objects.", "p": "p.291", "id": "xB-2"}, {"c": "02", "q": "Before an SSID can use remote RADIUS for 802.1X, what must exist on FortiGate?", "o": ["A WIDS profile assigned to the SSID radios", "A RADIUS server entry under User & Authentication", "A local user group already containing every RADIUS user", "An SSL inspection profile on the SSID policy"], "k": [1], "w": "You must preconfigure the RADIUS server under User & Authentication > RADIUS Servers.", "p": "p.152", "id": "xB-3"}, {"c": "07", "q": "How do FortiAP and FortiSwitch devices get into FortiAIOps inventory?", "o": ["Each one is imported from a CSV file of FortiAP serial numbers", "Each must be claimed with its FortiCloud key", "They appear only after a SAM baseline test runs", "They are added automatically from the managed FortiGate"], "k": [3], "w": "Devices controlled by an added FortiGate are added automatically.", "p": "p.311", "id": "xB-4"}, {"c": "06", "q": "An external captive portal server is used. Which two-step process lets clients reach it before they authenticate?", "o": ["Exempt it on the SSID and add a matching firewall policy", "Create an L3 firewall profile and a QoS profile", "Assign a Bonjour profile and enable SSID groups", "Add it to a VLAN pool and enable a DHCP server on each pool VLAN"], "k": [0], "w": "Exempt destinations on the SSID, then a firewall policy for the pinhole.", "p": "p.268", "id": "xB-5"}, {"c": "09", "q": "Which command shows RF conditions and RF score for every radio, not just the worst interfaces the GUI lists?", "o": ["get wireless-controller status", "get wireless-controller scan", "cw_diag -c his-chutil", "get wireless-controller rf-analysis"], "k": [3], "w": "rf-analysis lists all interfaces, unlike the GUI's worst-only view.", "p": "p.352", "id": "xB-6"}, {"c": "01", "q": "A new FortiAP shows as discovered but grey in Managed FortiAPs. What must happen before FortiGate pushes any configuration?", "o": ["The AP must be authorized", "The AP must get a new firmware", "The AP must be rebooted twice", "The AP must join an AP group"], "k": [0], "w": "No settings are pushed until FortiGate authorizes the AP.", "p": "p.88", "id": "xB-7"}, {"c": "04", "q": "Frequency handoff is enabled. A dual-band client with strong 5 GHz RSSI tries to join on 2.4 GHz. What does FortiGate do?", "o": ["Accepts it on 2.4 GHz and logs a WIDS alert", "Sends it an association response with status code 17 (busy)", "Ignores the 2.4 GHz request until the client times out", "Moves the client to another AP on 2.4 GHz"], "k": [2], "w": "FortiGate ignores 2.4 GHz requests from capable clients with good 5 GHz RSSI until they retry on 5 GHz.", "p": "p.230", "id": "xB-8"}, {"c": "08", "q": "Channel utilization on a radio is regularly above 75%, but only two clients are connected. What is a likely cause?", "o": ["Too few SSIDs on the AP", "Neighboring networks on the same channel", "DARRP being disabled on that radio's FortiAP profile", "A low handoff-rssi value"], "k": [1], "w": "Utilization counts all decodable traffic, including neighbors. Change channel if neighbors cause it.", "p": "p.332", "id": "xB-9"}, {"c": "02", "q": "Which statement describes WPA3 compared with WPA2?", "o": ["WPA3 uses RC4 with 256-bit keys and optional PMF", "WPA3 uses AES-CCMP with 64-bit keys and no PMF", "WPA3 uses TKIP with 128-bit keys and optional PMF for clients", "WPA3 uses AES-GCM with 192-bit keys and mandatory PMF"], "k": [3], "w": "WPA3 uses AES-GCM with ECC, 192-bit session keys, and PMF is mandatory.", "p": "p.140", "id": "xB-10"}, {"c": "08", "q": "A handheld client shows strong signal but a low upstream link rate while it's idle. What is the most likely explanation?", "o": ["The client is in power-saving mode", "The SSID uses WPA3 transition mode", "The AP's DARRP profile lowered its rate", "The client is on a 160 MHz channel"], "k": [0], "w": "Upstream rates drop in power save. Judge link rates only while data is moving.", "p": "p.325", "id": "xB-11"}, {"c": "04", "q": "Which WIDS attack detection has a default threshold of 30 requests in 10 seconds?", "o": ["Association frame flooding", "Weak WEP IV detection", "Invalid MAC OUI", "Long duration attack"], "k": [0], "w": "Association and authentication frame flooding default to 30 requests in 10 seconds.", "p": "p.238", "id": "xB-12"}, {"c": "04", "q": "What happens if a FortiAP profile setting isn't supported by the AP hardware?", "o": ["FortiGate removes that setting for the AP", "FortiGate assigns the model default profile instead", "The AP rejects the whole profile and goes offline", "The AP applies the setting to its other radio"], "k": [0], "w": "If the hardware doesn't support a setting, FortiGate removes it for that AP.", "p": "p.205", "id": "xB-13"}, {"c": "03", "q": "On a tunnel mode SSID with VLANs, which statement is correct?", "o": ["VLANs are tagged by the FortiAP onto its LAN port", "Each VLAN needs its own IP, DHCP, and firewall policy", "VLANs can only be assigned through MPSK groups", "VLANs simply inherit the SSID's own DHCP server and firewall policy"], "k": [1], "w": "VLANs are separate interfaces that need IP settings, DHCP, and their own policies.", "p": "p.170", "id": "xB-14"}, {"c": "09", "q": "You need 30 minutes in a FortiAP CLI session without being logged out. What do you run on the AP?", "o": ["cfg -a ADMIN_TIMEOUT=30, then cfg -c", "cfg -a MESH_AP_TYPE=30, then cfg -c", "set admintimeout 30 under FortiGate system global", "cw_diag --tlog on, then cw_diag repeat 30"], "k": [0], "w": "The FortiAP CLI times out after 5 minutes. Extend it with cfg -a ADMIN_TIMEOUT and commit with cfg -c.", "p": "p.354", "id": "xB-15"}, {"c": "09", "q": "A sniffer radio has ap-sniffer-addr set to 00:00:00:00:00:00. What does it capture?", "o": ["Nothing, because the sniffer is disabled", "Only the AP's own beacon frames", "Only broadcast and multicast frames", "All traffic on the sniffed channel"], "k": [3], "w": "The wildcard MAC captures all traffic on the channel, often more than needed.", "p": "p.350", "id": "xB-16"}, {"c": "03", "q": "In the IOC quarantine sequence, which component produces the security risk verdict?", "o": ["FortiSwitch", "FortiGate", "FortiAnalyzer", "FortiAP"], "k": [2], "w": "FortiAnalyzer analyzes logs with IOC services and sends the verdict to FortiGate.", "p": "p.194", "id": "xB-17"}, {"c": "09", "q": "Which FortiAP command shows the last minute of channel use on the AP's configured channel?", "o": ["cw_diag -c all-chutil", "iwconfig", "cw_diag -c his-chutil", "cw_diag ksta"], "k": [2], "w": "his-chutil gives one minute of history for the configured channel. all-chutil covers all allowed channels.", "p": "p.356", "id": "xB-18"}, {"c": "03", "q": "Dynamic VLAN assignment uses a name tag. How many VLAN IDs can one name map to, and how is one chosen?", "o": ["Only one, chosen by RADIUS", "Up to sixteen, chosen at random", "Up to four, chosen by hash", "Up to eight, chosen round robin"], "k": [3], "w": "A name maps to up to eight VLAN IDs, chosen round robin.", "p": "p.176", "id": "xB-19"}, {"c": "03", "q": "Where can you view wireless devices that have matched NAC policies in the GUI?", "o": ["WiFi & Switch Controller > SSIDs > NAC Profiles tab", "Log & Report > Events > WiFi Events", "Dashboard > WiFi > Clients By FortiAP", "Dashboard > Assets & Identities > Matched Devices"], "k": [3], "w": "Matched Devices lists NAC-matched devices.", "p": "p.189", "id": "xB-20"}, {"c": "00", "q": "Users report slow Wi-Fi in a busy office where one laptop stays on a distant AP at a low rate. Which two effects does this sticky client cause? (Choose two.)", "o": ["It forces the AP onto a DFS channel", "It disables beacons on the original AP", "It uses more airtime, hurting other clients", "It widens the co-channel interference area"], "k": [2, 3], "w": "Sticky clients use more airtime at low rates and expand the CCI area.", "p": "p.62", "id": "xB-21"}, {"c": "01", "q": "Which FortiAP discovery method uses the hostname apctrl1.fortilcloud.com?", "o": ["Static", "DNS", "FortiEdge Cloud", "Multicast"], "k": [2], "w": "FortiEdge Cloud discovery uses apctrl1.fortilcloud.com. DNS uses AC_HOSTNAME_1.", "p": "p.85", "id": "xB-22"}, {"c": "06", "q": "FortiGate redirects users to an external portal over HTTPS. What must the portal address be?", "o": ["An FQDN matching the certificate CN", "The IP of the FortiGate WAN port", "The MAC address of the FortiAP", "A URL ending in :1003/fgtauth"], "k": [0], "w": "With HTTPS, the portal address must be an FQDN that matches the certificate CN.", "p": "p.269", "id": "xB-23"}, {"c": "08", "q": "Where are FortiOS SAM test results captured?", "o": ["In a FortiAnalyzer SAM report", "In the WIDS profile statistics", "In the Wi-Fi event logs", "Only in the FortiAP local GUI"], "k": [2], "w": "SAM ping and iPerf results are captured in the Wi-Fi event logs.", "p": "p.341", "id": "xB-24"}, {"c": "08", "q": "One AP suddenly has far more associated clients than usual. Which cause does the guide list?", "o": ["The SSID was changed to WPA3 transition", "A nearby AP or interface has gone down", "Short guard interval was enabled on 5 GHz", "DARRP was disabled on that AP's radios"], "k": [1], "w": "A higher than expected count can come from a nearby AP that stopped running, or an unexpected client band mix.", "p": "p.328", "id": "xB-25"}, {"c": "02", "q": "Which SSID type gives FortiGate full session visibility and applies firewall policy to all client traffic?", "o": ["Tunnel mode", "Mesh mode", "Bridge mode", "Local LAN port bridge"], "k": [0], "w": "Tunnel mode sends all traffic to FortiGate for policy and inspection at the session level.", "p": "p.120", "id": "xB-26"}, {"c": "00", "q": "A client moves farther from its AP and its signal drops. What do the AP and client radios typically do?", "o": ["Disable MU-MIMO for that client only", "Shift down to a lower link rate", "Switch from CSMA/CA to CSMA/CD", "Increase the channel width to 80 MHz"], "k": [1], "w": "Both radios monitor connection health and shift link rates down as signal drops.", "p": "p.36", "id": "xB-27"}, {"c": "03", "q": "Which two statements about VLAN pooling load balancing are correct? (Choose two.)", "o": ["Pool VLANs are placed in an SSID-based zone", "FortiOS sets up DHCP on each pool VLAN", "It is available only on tunnel mode SSIDs", "It needs WPA2-Enterprise with RADIUS"], "k": [0, 2], "w": "Load balancing VLANs go into <SSID>.zone, and it's tunnel only. DHCP is configured manually.", "p": "p.180", "id": "xB-28"}, {"c": "08", "q": "Which statement about signal strength values shown on the controller is correct?", "o": ["They are an average of both directions of the link", "They are measured by the client and sent to the AP", "They are the client's signal as received by the AP", "They are the AP's signal as received by the client"], "k": [2], "w": "RSSI on the controller is measured by the AP when receiving from the client.", "p": "p.324", "id": "xB-29"}, {"c": "01", "q": "A point-to-point mesh bridge links two LAN segments. Which device must be the mesh root?", "o": ["A FortiWiFi", "A FortiSwitch", "A FortiExtender", "A FortiAP"], "k": [3], "w": "For a point-to-point bridge, the mesh root must be FortiAP, not FortiWiFi.", "p": "p.103", "id": "xB-30"}, {"c": "05", "q": "On-wire detection flags an AP. What evidence did FortiGate use?", "o": ["The AP's SSID exactly matched one of your own corporate SSIDs", "A wireless client MAC was also seen on the wired network", "The AP was on the same channel as your APs", "The AP sent CAPWAP discovery to your FortiGate"], "k": [1], "w": "On-wire detection compares wireless client MACs with MACs seen on the wire.", "p": "p.250", "id": "xB-31"}, {"c": "02", "q": "Which encapsulated EAP method exchanges attribute-value pairs inside TLS and can use PAP or CHAP?", "o": ["PEAPv1/EAP-GTC", "EAP-TLS", "EAP-TTLS", "PEAPv0/MSCHAPv2"], "k": [2], "w": "EAP-TTLS uses AVPs that can carry native EAP or legacy PAP and CHAP.", "p": "p.135", "id": "xB-32"}, {"c": "05", "q": "Which statement about a dedicated monitor radio is correct?", "o": ["It broadcasts a hidden SSID for rogue clients", "It scans continuously and serves no clients", "It only scans when DARRP runs every 24 hours", "It scans in idle time between serving clients"], "k": [1], "w": "Dedicated monitor radios do continuous foreground scans and don't serve clients.", "p": "p.248", "id": "xB-33"}, {"c": "08", "q": "Which statement about the channel noise value an AP reports is correct?", "o": ["It's an exact reading from a built-in spectrum analyzer", "It's the noise level each client reports to the AP", "It's an estimate taken when the radio isn't serving clients", "It's measured only on DFS channels by the 5 GHz radio"], "k": [2], "w": "The interface measures the noise floor when idle. It's an estimate, not a spectrum analyzer reading.", "p": "p.323", "id": "xB-34"}, {"c": "05", "q": "Which two statements about rogue AP suppression are correct? (Choose two.)", "o": ["It works with background scanning only", "It requires a dedicated monitor radio", "Marking an AP as Rogue suppresses it", "Local laws should be checked before using it"], "k": [1, 3], "w": "Suppression needs a dedicated monitor radio and legal review. Marking Rogue alone doesn't block.", "p": "p.252", "id": "xB-35"}, {"c": "06", "q": "Which advanced wireless profile provides a Wi-Fi bridge access control list for IPv4 and IPv6?", "o": ["QoS profile", "L3 firewall profile", "Syslog profile", "FortiAP configuration profile"], "k": [1], "w": "L3 firewall profiles are bridge ACLs matching IP, ports, and IANA protocol numbers.", "p": "p.260", "id": "xB-36"}, {"c": "04", "q": "Transmit power mode is Auto with defaults. What is the default power range?", "o": ["5 to 20 dBm", "1 to 33 dBm", "17 to 30 dBm", "10 to 17 dBm"], "k": [3], "w": "Auto mode defaults to 10 to 17 dBm. dBm mode allows 1 to 33.", "p": "p.220", "id": "xB-37"}, {"c": "00", "q": "What does the MIMO notation 4x4:3 describe?", "o": ["Four clients served at once on three channels", "Four radios, four SSIDs, three bands in use", "Four TX chains, four RX chains, three streams", "Four antennas on 2.4 GHz, three on 5 GHz"], "k": [2], "w": "NxM:S is transmit chains, receive chains, and spatial streams.", "p": "p.30", "id": "xB-38"}, {"c": "01", "q": "An administrator wants newly discovered FortiAPs on port5 to be managed without manual approval. Which command achieves this?", "o": ["set rolling-wtp-upgrade enable on port5", "set auto-auth-extension-device enable on port5", "set discovery-interval 5 on port5", "set wireless-controller enable under port5 settings"], "k": [1], "w": "auto-auth-extension-device under the interface authorizes new FortiAPs automatically.", "p": "p.88", "id": "xB-39"}, {"c": "04", "q": "By default, what does a managed FortiAP do with direct HTTPS or SSH admin sessions?", "o": ["It drops them", "It allows them", "It redirects them to FortiGate", "It logs and allows them"], "k": [0], "w": "After FortiGate manages the AP, it drops direct HTTPS and SSH by default.", "p": "p.211", "id": "xB-40"}]}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const CH=D.ch, CHS=Object.keys(CH).sort();
const DAY=864e5, IV=[0,1,2,4,8,16,32];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={cards:{},quiz:{},exams:[],filter:[],updated:0};
let view='review';

/* ---------- persistence: account (db) first, this browser as fallback ---------- */
const LK='recall-fap76';
function setSave(cls,txt){const el=$('#save');el.className='save '+cls;el.innerHTML='<i></i>'+esc(txt);}
function loadLocal(){try{const t=localStorage.getItem(LK);return t?JSON.parse(t):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}
function merge(o){if(o&&typeof o==='object'&&(o.updated||0)>(S.updated||0)){S=Object.assign({cards:{},quiz:{},exams:[],filter:[]},o)}}
function persist(){S.updated=Date.now();saveLocal();}
async function initStore(){merge(loadLocal());render();setSave('local','Saved on this device');}
function exportProgress(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='recall-fap76-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
function importProgress(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.cards!=='object')throw 0;S=Object.assign({cards:{},quiz:{},exams:[],filter:[]},o);S.updated=Date.now();saveLocal();queue=[];cur=null;window._imp='Progress imported.';renderWeak();}catch(e){window._imp='That file is not a RECALL progress backup.';renderWeak();}};r.readAsText(file);}

/* ---------- review (Leitner spaced repetition) ---------- */
let queue=[], cur=null, flipped=false, ahead=false;
function inFilter(c){return !S.filter.length||S.filter.includes(c.c)}
function st(id){return S.cards[id]}
function buildQueue(){
  const now=Date.now(); const pool=D.cards.filter(inFilter);
  const due=pool.filter(c=>st(c.id)&&st(c.id).d<=now).sort((a,b)=>st(a.id).d-st(b.id).d);
  const fresh=pool.filter(c=>!st(c.id));
  queue=due.concat(fresh.slice(0,Math.max(0,20-Math.min(due.length,20))));
  if(ahead&&!queue.length){queue=pool.filter(c=>st(c.id)).sort((a,b)=>st(a.id).d-st(b.id).d).slice(0,20);}
  cur=queue.shift()||null; flipped=false;
}
function grade(g){
  if(!cur||!flipped)return;
  const now=Date.now(); const s=st(cur.id)||{b:0,d:0,r:0,m:0};
  s.r++;
  if(g===0){s.m++;s.b=0;s.d=now;queue.splice(Math.min(3,queue.length),0,cur);}
  else if(g===1){s.b=Math.max(1,s.b);s.d=now+IV[s.b]*DAY;}
  else{s.b=Math.min(IV.length-1,s.b+1);s.d=now+IV[s.b]*DAY;}
  S.cards[cur.id]=s; persist();
  cur=queue.shift()||null; flipped=false; renderReview();
}
function counts(){
  const now=Date.now(); const pool=D.cards.filter(inFilter);
  let due=0,fresh=0,learned=0;
  pool.forEach(c=>{const s=st(c.id); if(!s)fresh++; else{if(s.d<=now)due++; if(s.b>=3)learned++;}});
  return {due,fresh,learned,total:pool.length};
}
function chipBar(){
  return '<div class="chips" role="group" aria-label="Chapters"><button class="chip" data-ch="all" aria-pressed="'+(!S.filter.length)+'">All chapters</button>'+
   CHS.map(k=>'<button class="chip" data-ch="'+k+'" aria-pressed="'+S.filter.includes(k)+'" title="'+esc(CH[k])+'">Ch '+k+'</button>').join('')+'</div>';
}
function renderReview(){
  const k=counts();
  let h='<div class="stack">'+chipBar()+
   '<div class="stats"><div class="stat"><div class="n">'+k.due+'</div><div class="l">Due now</div></div><div class="stat"><div class="n">'+k.fresh+'</div><div class="l">Not seen</div></div><div class="stat"><div class="n">'+k.learned+'<span class="muted" style="font-size:14px"> / '+k.total+'</span></div><div class="l">Learned</div></div></div>';
  if(cur){
    h+='<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="meta"><span>CH '+cur.c+' · '+esc(CH[cur.c]).toUpperCase()+'</span><span>'+(st(cur.id)?'BOX '+st(cur.id).b:'NEW')+'</span></div>'+
     '<div class="front">'+esc(cur.q)+'</div>'+
     (flipped?'<div class="back">'+esc(cur.a)+(cur.s?'<div><span class="src">'+esc(cur.s)+'</span></div>':'')+'</div>':'<div class="hint">Tap or press Space to show the answer</div>')+'</div>'+
     '<div class="btns"><button class="b miss" data-g="0" '+(flipped?'':'disabled')+'>Missed<small>1 · again soon</small></button><button class="b hard" data-g="1" '+(flipped?'':'disabled')+'>Shaky<small>2 · tomorrow</small></button><button class="b good" data-g="2" '+(flipped?'':'disabled')+'>Got it<small>3 · longer gap</small></button></div>'+
     '<p class="note mono">'+queue.length+' more in this session</p>';
  }else{
    let next=Infinity; D.cards.filter(inFilter).forEach(c=>{const s=st(c.id); if(s&&s.d>Date.now())next=Math.min(next,s.d)});
