    h+='<div class="panel stack"><h2>All caught up</h2><p class="muted">Nothing is due in these chapters'+(next<Infinity?'. Next card is due '+new Date(next).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}):'')+'.</p><div class="row"><button class="b pri" id="ahead">Study ahead (20 cards)</button></div></div>';
  }
  h+='</div>'; $('#app').innerHTML=h;
}

/* ---------- quiz ---------- */
let QZ=null;
function quizCh(){return [...new Set(D.quiz.map(q=>q.c))].sort()}
function renderQuizHome(){
  let h='<div class="stack"><div><h2>Chapter quizzes</h2><p class="muted">Feedback after each question, with the study guide page.</p></div><div class="qlist">';
  quizCh().forEach(c=>{const n=D.quiz.filter(q=>q.c===c).length; const r=S.quiz[c];
    h+='<button class="qitem" data-qz="'+c+'"><span class="mono muted" style="font-size:12px">CH '+c+' · '+n+' QUESTIONS</span><span class="t">'+esc(CH[c])+'</span><span class="mono muted" style="font-size:12px">'+(r&&r.t?('Overall '+Math.round(100*r.r/r.t)+'% · '+r.t+' answered'):'Not taken')+'</span></button>'});
  h+='</div></div>'; $('#app').innerHTML=h;
}
function startQuiz(c){QZ={c,qs:D.quiz.filter(q=>q.c===c),i:0,sel:[],done:false,right:0};renderQuiz()}
function optsHtml(q,sel,reveal){
  return '<div class="opts">'+q.o.map((o,i)=>{let cls='opt';if(reveal){if(q.k.includes(i))cls+=' right';else if(sel.includes(i))cls+=' wrong'}
    return '<button class="'+cls+'" data-o="'+i+'" aria-pressed="'+sel.includes(i)+'" '+(reveal?'disabled':'')+'><span class="k">'+'abcd'[i]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
}
function isRight(q,sel){return sel.length===q.k.length&&q.k.every(x=>sel.includes(x))}
function renderQuiz(){
  if(!QZ)return renderQuizHome();
  const q=QZ.qs[QZ.i];
  if(!q){const pct=Math.round(100*QZ.right/QZ.qs.length);
    $('#app').innerHTML='<div class="panel stack"><span class="mono muted">CH '+QZ.c+' · '+esc(CH[QZ.c]).toUpperCase()+'</span><h2>'+QZ.right+' of '+QZ.qs.length+' right ('+pct+'%)</h2><div class="bar"><span style="width:'+pct+'%"></span></div><div class="row"><button class="b pri" data-qz="'+QZ.c+'">Retake</button><button class="b" id="qback">All quizzes</button></div></div>';return}
  const need=q.k.length;
  let h='<div class="stack"><div class="row"><span class="mono muted">CH '+q.c+' · QUESTION '+(QZ.i+1)+' OF '+QZ.qs.length+'</span><button class="b" id="qback" style="margin-left:auto;padding:6px 10px">Exit</button></div><div class="bar"><span style="width:'+(100*QZ.i/QZ.qs.length)+'%"></span></div>'+
   '<div class="qstem">'+esc(q.q)+'</div>'+optsHtml(q,QZ.sel,QZ.done);
  if(QZ.done){const ok=isRight(q,QZ.sel);
    h+='<div class="explain"><div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not quite. Answer: '+q.k.map(i=>'abcd'[i]).join(', '))+'</div><p style="margin:.3em 0 0">'+esc(q.w)+' <span class="src">SG '+esc(q.p)+'</span></p></div><div class="row"><button class="b pri" id="qnext">'+(QZ.i+1<QZ.qs.length?'Next question':'See score')+'</button></div>';
  }else h+='<div class="row"><button class="b pri" id="qcheck" '+(QZ.sel.length===need?'':'disabled')+'>Check answer</button>'+(need>1?'<span class="note">Choose '+need+'.</span>':'')+'</div>';
  $('#app').innerHTML=h+'</div>';
}
function pick(q,sel,i){const need=q.k.length; const at=sel.indexOf(i);
  if(at>=0)sel.splice(at,1); else{if(need===1)sel.length=0; else if(sel.length>=need)sel.shift(); sel.push(i)}}
function checkQuiz(){const q=QZ.qs[QZ.i];QZ.done=true;const ok=isRight(q,QZ.sel);if(ok)QZ.right++;
  const r=S.quiz[q.c]||{r:0,t:0,miss:{}};r.t++;if(ok)r.r++;else r.miss[q.id]=(r.miss[q.id]||0)+1;S.quiz[q.c]=r;persist();renderQuiz()}

/* ---------- exam ---------- */
let EX=null, tick=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(form){EX={form:form,qs:form==='M'?shuffle(D.quiz).slice(0,30):D.exams[form].slice(),ans:{},i:0,end:Date.now()+70*60000,done:false};clearInterval(tick);tick=setInterval(()=>{if(view==='exam'&&EX&&!EX.done){if(Date.now()>=EX.end)finishExam();else{const t=$('#timer');if(t)t.textContent=fmt(EX.end-Date.now())}}},1000);renderExam()}
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')}
function finishExam(){if(!EX||EX.done)return;EX.done=true;clearInterval(tick);
  let right=0;const by={};EX.qs.forEach((q,i)=>{const ok=isRight(q,EX.ans[i]||[]);if(ok)right++;by[q.c]=by[q.c]||{r:0,t:0};by[q.c].t++;if(ok)by[q.c].r++;
    const r=S.quiz[q.c]||{r:0,t:0,miss:{}};r.t++;if(ok)r.r++;else r.miss[q.id]=(r.miss[q.id]||0)+1;S.quiz[q.c]=r});
  EX.right=right;EX.i=0;S.exams=[{at:Date.now(),f:EX.form,r:right,t:EX.qs.length,by}].concat(S.exams||[]).slice(0,10);persist();renderExam()}
function renderExam(){
  if(!EX){
    const name={A:'Practice Exam A',B:'Practice Exam B',M:'Mixed quiz exam'};
    const best=f=>{const l=(S.exams||[]).filter(e=>(e.f||'M')===f);return l.length?'Last: '+l[0].r+' / '+l[0].t+' ('+Math.round(100*l[0].r/l[0].t)+'%), '+new Date(l[0].at).toLocaleDateString():'Not taken'};
    const item=(f,desc)=>'<button class="qitem" data-ex="'+f+'"><span class="t">'+name[f]+'</span><span class="muted" style="font-size:13px">'+desc+'</span><span class="mono muted" style="font-size:12px">'+best(f)+'</span></button>';
    $('#app').innerHTML='<div class="stack"><div><h2>Practice exams</h2><p class="muted">70 minutes each, no feedback until you submit. The real exam is 30 to 40 questions in 70 minutes.</p></div><div class="qlist">'+
     item('A','40 scenario questions across all ten chapters, four of them choose-two.')+
     item('B','40 different scenario questions, same mix and rules as Form A.')+
     item('M','30 questions drawn at random from all '+D.quiz.length+' chapter quiz questions. Different every time.')+'</div></div>';return}
  const q=EX.qs[EX.i], sel=EX.ans[EX.i]||[];
  let dots='<div class="dots" aria-label="Questions">'+EX.qs.map((qq,i)=>{let c='';if(EX.done)c=isRight(qq,EX.ans[i]||[])?'r':'w';else if((EX.ans[i]||[]).length)c='ans';if(i===EX.i)c+=' cur';return '<button class="'+c+'" data-jump="'+i+'">'+(i+1)+'</button>'}).join('')+'</div>';
  let h='<div class="stack">';
  if(EX.done){const pct=Math.round(100*EX.right/EX.qs.length);
    h+='<div class="panel stack"><h2>'+EX.right+' of '+EX.qs.length+' ('+pct+'%)</h2><div class="bar"><span style="width:'+pct+'%"></span></div><p class="note">Click any number to review that question. Green was right, red was wrong.</p><div class="row"><button class="b pri" id="exstart">New exam</button><button class="b" id="exclose">Close</button></div></div>';
  }else h+='<div class="row"><span class="mono muted">QUESTION '+(EX.i+1)+' OF '+EX.qs.length+'</span><span class="timer" id="timer" style="margin-left:auto">'+fmt(EX.end-Date.now())+'</span></div>';
  h+=dots+'<div class="qstem">'+esc(q.q)+'</div>'+optsHtml(q,sel,EX.done);
  if(EX.done){const ok=isRight(q,sel);h+='<div class="explain"><div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Answer: '+q.k.map(i=>'abcd'[i]).join(', '))+'</div><p style="margin:.3em 0 0">'+esc(q.w)+' <span class="src">SG '+esc(q.p)+'</span></p></div>'}
  else if(q.k.length>1)h+='<p class="note">Choose '+q.k.length+'.</p>';
  h+='<div class="row"><button class="b" id="exprev" '+(EX.i?'':'disabled')+'>Previous</button><button class="b" id="exnext" '+(EX.i<EX.qs.length-1?'':'disabled')+'>Next</button>'+(EX.done?'':'<button class="b pri" id="exsubmit" style="margin-left:auto">Submit exam</button>')+'</div>';
  if(!EX.done&&EX.confirm)h+='<div class="panel row"><span>'+(EX.qs.length-Object.values(EX.ans).filter(a=>a.length).length)+' unanswered. Submit anyway?</span><button class="b pri" id="exyes">Submit</button><button class="b" id="exno">Keep going</button></div>';
  $('#app').innerHTML=h+'</div>';
}

/* ---------- weak areas ---------- */
function chapterStats(c){
  const cards=D.cards.filter(x=>x.c===c); let seen=0,learned=0,r=0,m=0;
  cards.forEach(x=>{const s=st(x.id);if(s){seen++;r+=s.r;m+=s.m;if(s.b>=3)learned++}});
  const q=S.quiz[c]; const acc=q&&q.t?q.r/q.t:null; const lapse=r?m/r:0;
  let sev='none',lab='Not started';
  if(seen||acc!==null){
    if((acc!==null&&acc<.7)||(r>=10&&lapse>.35)){sev='high';lab='High'}
    else if((acc!==null&&acc<.85)||lapse>.2||learned/cards.length<.3){sev='watch';lab='Watch'}
    else{sev='solid';lab='Solid'}
  }
  return {n:cards.length,seen,learned,lapse,acc,sev,lab};
}
function renderWeak(){
  const order={high:0,watch:1,solid:2,none:3};
  const rows=CHS.map(c=>Object.assign({c},chapterStats(c))).sort((a,b)=>order[a.sev]-order[b.sev]||a.c.localeCompare(b.c));
  let h='<div class="stack"><div><h2>Weak areas</h2><p class="muted">High means quiz accuracy under 70% or more than a third of card reviews missed. Watch means under 85%, over 20% missed, or under 30% of cards learned. Learned means a card has reached box 3.</p></div><div class="panel scroll"><table class="tbl"><thead><tr><th>Chapter</th><th>Status</th><th>Learned</th><th>Missed</th><th>Quiz</th></tr></thead><tbody>';
  rows.forEach(x=>{h+='<tr><td><span class="mono muted">'+x.c+'</span> '+esc(CH[x.c])+'</td><td><span class="pill '+x.sev+'">'+x.lab+'</span></td><td class="mono">'+x.learned+'/'+x.n+'</td><td class="mono">'+(x.seen?Math.round(100*x.lapse)+'%':'·')+'</td><td class="mono">'+(x.acc===null?'·':Math.round(100*x.acc)+'%')+'</td></tr>'});
  h+='</tbody></table></div>';
  const missed=D.cards.filter(c=>st(c.id)&&st(c.id).m>0).sort((a,b)=>st(b.id).m-st(a.id).m).slice(0,10);
  h+='<div class="panel stack"><h3>Most missed cards</h3>'+(missed.length?missed.map(c=>'<div><div><span class="mono muted">CH '+c.c+' · missed '+st(c.id).m+'x</span></div><div style="font-weight:600">'+esc(c.q)+'</div><div class="muted">'+esc(c.a)+(c.s?' <span class="src">'+esc(c.s)+'</span>':'')+'</div></div>').join(''):'<p class="muted">No misses yet. Cards you mark Missed show up here.</p>')+'</div>';
  const ex=S.exams||[]; if(ex.length)h+='<div class="panel stack"><h3>Exam history</h3>'+ex.map(e=>'<div class="row mono"><span>'+new Date(e.at).toLocaleDateString()+' · '+({A:'Form A',B:'Form B'}[e.f]||'Mixed')+'</span><span style="margin-left:auto">'+e.r+' / '+e.t+' ('+Math.round(100*e.r/e.t)+'%)</span></div>').join('')+'</div>';
  h+='<div class="panel stack"><h3>Backup</h3><p class="note">Progress lives on this device only. Export a backup now and then, and import it on a new phone or after clearing the browser.</p><div class="row"><button class="b" id="export">Export progress</button><label class="b" for="importfile" style="cursor:pointer">Import progress</label><input type="file" id="importfile" accept="application/json,.json" hidden></div>'+(window._imp?'<p class="note">'+esc(window._imp)+'</p>':'')+'</div>';
  h+='<div class="row"><button class="b" id="reset">Reset all progress</button></div>'+(window._rc?'<div class="panel row"><span>This clears every card, quiz and exam result.</span><button class="b miss" id="resetyes">Clear progress</button><button class="b" id="resetno">Cancel</button></div>':'');
  $('#app').innerHTML=h+'</div>';
}

/* ---------- shell ---------- */
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));
  if(view==='review'){if(!cur&&!queue.length)buildQueue();renderReview()}
  else if(view==='quiz')renderQuiz(); else if(view==='exam')renderExam(); else renderWeak();
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;if(view==='review'){ahead=false;buildQueue()}render()});
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('button,.card'); if(!t)return;
  if(t.id==='card'){if(!flipped){flipped=true;renderReview()}return}
  if(t.dataset.ch){const k=t.dataset.ch;if(k==='all')S.filter=[];else{const i=S.filter.indexOf(k);i>=0?S.filter.splice(i,1):S.filter.push(k)}persist();ahead=false;buildQueue();renderReview();return}
  if(t.dataset.g!==undefined){grade(+t.dataset.g);return}
  if(t.id==='ahead'){ahead=true;buildQueue();renderReview();return}
  if(t.dataset.qz){startQuiz(t.dataset.qz);return}
  if(t.id==='qback'){QZ=null;renderQuizHome();return}
  if(view==='quiz'&&t.dataset.o!==undefined&&QZ&&!QZ.done){pick(QZ.qs[QZ.i],QZ.sel,+t.dataset.o);renderQuiz();return}
  if(t.id==='qcheck'){checkQuiz();return}
  if(t.id==='qnext'){QZ.i++;QZ.sel=[];QZ.done=false;renderQuiz();return}
  if(t.dataset.ex){startExam(t.dataset.ex);return}
  if(t.id==='exstart'){startExam(EX&&EX.form||'M');return}
  if(t.id==='exclose'){EX=null;renderExam();return}
  if(view==='exam'&&EX){
    if(t.dataset.o!==undefined&&!EX.done){const a=EX.ans[EX.i]||[];pick(EX.qs[EX.i],a,+t.dataset.o);EX.ans[EX.i]=a;renderExam();return}
    if(t.dataset.jump){EX.i=+t.dataset.jump;EX.confirm=false;renderExam();return}
    if(t.id==='exprev'){EX.i--;renderExam();return} if(t.id==='exnext'){EX.i++;renderExam();return}
    if(t.id==='exsubmit'){const un=EX.qs.length-Object.values(EX.ans).filter(a=>a.length).length;if(un){EX.confirm=true;renderExam()}else finishExam();return}
    if(t.id==='exyes'){finishExam();return} if(t.id==='exno'){EX.confirm=false;renderExam();return}
  }
  if(t.id==='export'){exportProgress();return}
  if(t.id==='reset'){window._rc=true;renderWeak();return}
  if(t.id==='resetno'){window._rc=false;renderWeak();return}
  if(t.id==='resetyes'){window._rc=false;S={cards:{},quiz:{},exams:[],filter:[],updated:0};persist();queue=[];cur=null;renderWeak();return}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(view==='review'&&cur){
    if(e.code==='Space'){e.preventDefault();if(!flipped){flipped=true;renderReview()}}
    else if(flipped&&['1','2','3'].includes(e.key))grade(+e.key-1);
  }else if(view==='quiz'&&QZ&&QZ.qs[QZ.i]){
    const i='abcd1234'.indexOf(e.key.toLowerCase())%4;
    if(!QZ.done&&i>=0&&e.key.length===1){pick(QZ.qs[QZ.i],QZ.sel,i);renderQuiz()}
    else if(e.key==='Enter'){if(!QZ.done&&QZ.sel.length===QZ.qs[QZ.i].k.length)checkQuiz();else if(QZ.done){QZ.i++;QZ.sel=[];QZ.done=false;renderQuiz()}}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='importfile'&&e.target.files[0])importProgress(e.target.files[0])});
initStore();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
</script>
